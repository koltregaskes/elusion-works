<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saltmere — a small drivable town</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05070b;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:#eef2f7;user-select:none}
  #c{display:block;width:100vw;height:100vh;outline:none}
  .panel{position:fixed;background:rgba(10,14,22,.62);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-radius:12px}
  #topleft{top:14px;left:14px;padding:10px 14px;min-width:150px}
  #topleft .brand{font-weight:800;letter-spacing:.28em;font-size:13px;color:#ffd27a}
  #clock{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
  #sub{font-size:12px;opacity:.75}
  #minimap{position:fixed;top:14px;right:14px;width:210px;height:210px;border-radius:50%;box-shadow:0 6px 24px rgba(0,0,0,.45)}
  #speedo{position:fixed;right:14px;bottom:14px;width:210px;height:210px;transition:opacity .4s}
  #help{left:14px;bottom:14px;padding:12px 14px;font-size:12.5px;line-height:1.65;transition:opacity .5s}
  #help b{display:inline-block;min-width:68px;color:#ffd27a;font-weight:700}
  #help .h{font-weight:800;letter-spacing:.12em;font-size:11px;opacity:.7;margin-bottom:4px}
  #prompt{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);padding:9px 16px;font-size:15px;font-weight:600;display:none}
  #prompt kbd{background:#ffd27a;color:#111;border-radius:5px;padding:1px 7px;margin-right:8px;font-family:inherit;font-weight:800}
  #toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-size:30px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#fff;text-shadow:0 3px 18px rgba(0,0,0,.6);opacity:0;transition:opacity .8s;pointer-events:none;text-align:center}
  #toast small{display:block;font-size:13px;letter-spacing:.3em;opacity:.8;font-weight:600}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#05070b;z-index:9;font-size:15px;letter-spacing:.2em}
  #loading .t{font-size:34px;font-weight:800;letter-spacing:.4em;color:#ffd27a;margin-bottom:10px}
#touch-controls{display:flex;position:fixed;bottom:12px;left:12px;right:12px;gap:6px;justify-content:center;flex-wrap:wrap;z-index:5}#touch-controls button{font:600 14px system-ui;color:#fff;background:#182334;border:1px solid #aabbd0;border-radius:8px;min-width:44px;min-height:44px;touch-action:none}#touch-controls button:active{background:#765b23}@media(max-width:640px){#help{display:none}#minimap{width:115px;height:115px}#speedo{width:130px;height:130px;bottom:120px}#prompt{bottom:120px}}</style>
<script type="importmap">
{ "imports": {
  "three": "../_shared/three-r160/build/three.module.js",
  "three/addons/": "../_shared/three-r160/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="topleft" class="panel"><div class="brand">SALTMERE</div><div id="clock">17:00</div><div id="sub">Town</div></div>
<canvas id="minimap" width="210" height="210"></canvas>
<canvas id="speedo" width="210" height="210"></canvas>
<div id="help" class="panel">
  <div class="h">CONTROLS · I to hide</div>
  <div><b>W A S D</b>drive / walk (arrows too)</div>
  <div><b>Space</b>handbrake</div>
  <div><b>Shift</b>run (on foot)</div>
  <div><b>E</b>get in / out of a parked car</div>
  <div><b>H</b>horn</div>
  <div><b>L</b>headlights auto / on / off</div>
  <div><b>C</b>near / far camera</div>
  <div><b>Drag</b>look around</div>
  <div><b>T</b>time speed &nbsp;·&nbsp; <b style="min-width:0">N</b> +3 hours</div>
  <div><b>M</b>mute</div>
</div>
<nav id="touch-controls" aria-label="Driving and walking controls"><button type="button" data-key="KeyA">Left</button><button type="button" data-key="KeyW">Forward</button><button type="button" data-key="KeyS">Brake / back</button><button type="button" data-key="KeyD">Right</button><button type="button" data-key="Space">Handbrake</button><button type="button" data-key="KeyE">Enter / exit</button><button type="button" data-key="KeyC">Camera</button><button type="button" data-key="KeyM">Sound</button></nav><div id="prompt" class="panel"></div>
<div id="toast"></div>
<div id="loading"><div class="t">SALTMERE</div><div id="ltxt">building the town…</div></div>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ============================================================ utilities
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry32(20261110);
const R=(a,b)=>a+(b-a)*rnd();
const RI=(a,b)=>Math.floor(R(a,b+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const damp=(a,b,k,dt)=>lerp(a,b,1-Math.exp(-k*dt));
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;}
const dampAng=(a,b,k,dt)=>a+angDiff(a,b)*(1-Math.exp(-k*dt));
const toastEl=document.getElementById('toast');let toastT=0;
function toastMsg(a,b){toastEl.innerHTML=a+(b?`<small>${b}</small>`:'');toastEl.style.opacity=1;toastT=2.2;}

// ============================================================ renderer / scene
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
const MAXANISO=renderer.capabilities.getMaxAnisotropy();

const scene=new THREE.Scene();
const skyCol=new THREE.Color(0x9cc4e8);
scene.background=skyCol;
scene.fog=new THREE.Fog(0x9cc4e8,90,430);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.1,1500);

const hemi=new THREE.HemisphereLight(0xcfe6ff,0x4a5a3a,1.0);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2dd,2.6);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
const SC=sun.shadow.camera;SC.left=-75;SC.right=75;SC.top=75;SC.bottom=-75;SC.near=1;SC.far=600;
sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.03;
scene.add(sun,sun.target);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.3,0.5,1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ============================================================ procedural textures
function canvasTex(w,h,draw,{repeat=true,srgb=true}={}){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);
  const t=new THREE.CanvasTexture(c);if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;}
  if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=MAXANISO;return t;
}
function noiseFill(x,w,h,base,amt,n){x.fillStyle=base;x.fillRect(0,0,w,h);for(let i=0;i<n;i++){const v=rnd();x.fillStyle=v<.5?`rgba(0,0,0,${rnd()*amt})`:`rgba(255,255,255,${rnd()*amt})`;const s=1+rnd()*2.5;x.fillRect(rnd()*w,rnd()*h,s,s);}}
const winTex=canvasTex(512,512,(x)=>{
  noiseFill(x,512,512,'#ece7dd',.06,9000);
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){const X=c*64,Y=r*64;
    x.fillStyle='#b9b2a4';x.fillRect(X+10,Y+12,44,44);
    const g=x.createLinearGradient(X+12,Y+14,X+48,Y+54);g.addColorStop(0,'#7d93a8');g.addColorStop(.45,'#3a4a5a');g.addColorStop(1,'#1c2631');
    x.fillStyle=g;x.fillRect(X+13,Y+15,38,38);x.fillStyle='#b9b2a4';x.fillRect(X+31,Y+15,2,38);x.fillRect(X+13,Y+33,38,2);
    x.fillStyle='rgba(0,0,0,.12)';x.fillRect(X,Y+60,64,4);}
});
const litTex=canvasTex(512,512,(x)=>{
  x.fillStyle='#000';x.fillRect(0,0,512,512);
  const cols=['#ffd690','#ffe7b5','#ffc777','#fff3d6','#bcd8ff','#ffb46b'];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){if(rnd()>.42)continue;const X=c*64,Y=r*64;
    const g=x.createLinearGradient(X,Y+15,X,Y+53);const col=pick(cols);g.addColorStop(0,col);g.addColorStop(1,'#6a4a20');
    x.fillStyle=g;x.fillRect(X+13,Y+15,38,38);x.fillStyle='#000';x.fillRect(X+31,Y+15,2,38);x.fillRect(X+13,Y+33,38,2);}
});
const asphaltTex=canvasTex(256,256,(x)=>noiseFill(x,256,256,'#3b3c40',.10,7000));
const paveTex=canvasTex(256,256,(x)=>{noiseFill(x,256,256,'#a9a69f',.07,5000);x.strokeStyle='rgba(60,55,50,.35)';x.lineWidth=2;for(let i=0;i<=256;i+=64){x.beginPath();x.moveTo(i,0);x.lineTo(i,256);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(256,i);x.stroke();}});
const grassTex=canvasTex(256,256,(x)=>{noiseFill(x,256,256,'#557a3c',.12,12000);for(let i=0;i<500;i++){x.fillStyle=`rgba(${120+rnd()*60|0},${150+rnd()*60|0},60,.25)`;x.fillRect(rnd()*256,rnd()*256,1,3);}});
const concreteTex=canvasTex(256,256,(x)=>{noiseFill(x,256,256,'#8f8c86',.08,6000);x.strokeStyle='rgba(40,40,40,.25)';x.lineWidth=1.5;for(let i=0;i<=256;i+=128){x.beginPath();x.moveTo(i,0);x.lineTo(i,256);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(256,i);x.stroke();}});
const glowTex=canvasTex(128,128,(x)=>{const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.35,'rgba(255,255,255,.45)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128);},{repeat:false});
const waterNormal=(()=>{const N=256,c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d');const img=x.createImageData(N,N);
  const waves=[];for(let i=0;i<9;i++)waves.push([RI(1,6)*(rnd()<.5?-1:1),RI(1,6)*(rnd()<.5?-1:1),R(0,6.28),R(.3,1)]);
  const H=(u,v)=>{let s=0;for(const w of waves)s+=Math.sin((w[0]*u+w[1]*v)*Math.PI*2/N+w[2])*w[3];return s;};
  for(let v=0;v<N;v++)for(let u=0;u<N;u++){const dx=H(u+1,v)-H(u-1,v),dy=H(u,v+1)-H(u,v-1);let nx=-dx*1.6,ny=-dy*1.6,nz=1;const l=Math.hypot(nx,ny,nz);const i=(v*N+u)*4;img.data[i]=(nx/l*.5+.5)*255;img.data[i+1]=(ny/l*.5+.5)*255;img.data[i+2]=(nz/l*.5+.5)*255;img.data[i+3]=255;}
  x.putImageData(img,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;})();

// ============================================================ world constants
const ROADS=[-120,-60,0,60,120];
const BC=[-90,-30,30,90];
const J=10, LANE=3, PARK_OFF=5;
const QZ0=126, QZ1=140, WORLD=178;
const blockType=(i,j)=>(i===1&&j===1)?'park':(i===3&&j===2)?'petrol':(j===3)?'harbour':'town';

// ============================================================ colliders (spatial hash)
const grid=new Map(),bigCols=[],CELL=20;
function insertCol(c,a,b,d,e){const m=2.5;for(let i=Math.floor((a-m)/CELL);i<=Math.floor((b+m)/CELL);i++)for(let k=Math.floor((d-m)/CELL);k<=Math.floor((e+m)/CELL);k++){const key=i*1000+k;let l=grid.get(key);if(!l){l=[];grid.set(key,l);}l.push(c);}}
function addBox(minx,maxx,minz,maxz,big=false){const c={t:0,minx,maxx,minz,maxz};if(big)bigCols.push(c);else insertCol(c,minx,maxx,minz,maxz);return c;}
function addCircle(x,z,r){const c={t:1,x,z,r};insertCol(c,x-r,x+r,z-r,z+r);return c;}
const EMPTY=[];const HIT={nx:0,nz:0,pen:0};
function circVs(c,x,z,r,o){
  if(c.t===1){const dx=x-c.x,dz=z-c.z,rr=r+c.r,d2=dx*dx+dz*dz;if(d2>=rr*rr)return false;const d=Math.sqrt(d2)||1e-4;o.nx=dx/d;o.nz=dz/d;o.pen=rr-d;return true;}
  const qx=clamp(x,c.minx,c.maxx),qz=clamp(z,c.minz,c.maxz),dx=x-qx,dz=z-qz,d2=dx*dx+dz*dz;
  if(d2>=r*r)return false;
  if(d2>1e-9){const d=Math.sqrt(d2);o.nx=dx/d;o.nz=dz/d;o.pen=r-d;return true;}
  const l=x-c.minx,rt=c.maxx-x,t=z-c.minz,b=c.maxz-z,m=Math.min(l,rt,t,b);
  if(m===l){o.nx=-1;o.nz=0;o.pen=l+r;}else if(m===rt){o.nx=1;o.nz=0;o.pen=rt+r;}else if(m===t){o.nx=0;o.nz=-1;o.pen=t+r;}else{o.nx=0;o.nz=1;o.pen=b+r;}
  return true;
}
function staticHits(x,z,r,cb){const l=grid.get(Math.floor(x/CELL)*1000+Math.floor(z/CELL))||EMPTY;for(const c of l)if(circVs(c,x,z,r,HIT))cb(HIT);for(const c of bigCols)if(circVs(c,x,z,r,HIT))cb(HIT);}

function groundH(x,z){
  if(z>=QZ0-0.01&&z<=QZ1+0.01&&Math.abs(x)<=WORLD+5)return 0.15;
  if(z>QZ1){if((x>=-64&&x<=-56&&z<=185)||(x>=56&&x<=64&&z<=202))return 0.15;return -0.8;}
  const bx=clamp(Math.round((x-30)/60)*60+30,-90,90),bz=clamp(Math.round((z-30)/60)*60+30,-90,90);
  if(Math.abs(x-bx)<24&&Math.abs(z-bz)<24)return 0.15;
  return 0;
}

// ============================================================ static geometry collectors
const bGeos=[], propGeos=[], mapRects=[];
function colorAttr(g,col,roofCol){const n=g.attributes.position.count,nr=g.attributes.normal,a=new Float32Array(n*3);for(let i=0;i<n;i++){const c=(roofCol&&nr.getY(i)>0.5)?roofCol:col;a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b;}g.setAttribute('color',new THREE.BufferAttribute(a,3));}
function plainUV(g){const uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,0.01,0.01);}
function addBGeo(g,col,roofCol,plain){g=g.index?g.toNonIndexed():g;if(plain)plainUV(g);colorAttr(g,new THREE.Color(col),roofCol!=null?new THREE.Color(roofCol):null);bGeos.push(g);}
function addProp(g,col,x=0,y=0,z=0,ry=0){if(ry)g.rotateY(ry);g.translate(x,y,z);g=g.index?g.toNonIndexed():g;colorAttr(g,new THREE.Color(col),null);propGeos.push(g);return g;}
function setWinUV(g,w,h,d){const uv=g.attributes.uv,fl=Math.max(1,Math.round(h/3.3));for(let f=0;f<6;f++){const ou=RI(0,7)/8,ov=RI(0,7)/8,cols=Math.max(1,Math.round(((f<2)?d:w)/3.2));for(let k=0;k<4;k++){const i=f*4+k;if(f===2||f===3){uv.setXY(i,0.01,0.01);continue;}uv.setXY(i,ou+uv.getX(i)*cols/8,ov+uv.getY(i)*fl/8);}}}
function addBuilding(x0,x1,z0,z1,h,col,roofCol,{windows=true,base=0.15,parapet=true,collide=true}={}){
  const w=x1-x0,d=z1-z0,g=new THREE.BoxGeometry(w,h,d);
  if(windows)setWinUV(g,w,h,d);
  g.translate((x0+x1)/2,base+h/2,(z0+z1)/2);
  addBGeo(g,col,roofCol,!windows);
  if(collide)addBox(x0,x1,z0,z1);
  mapRects.push([x0,z0,w,d,'#61646c']);
  const top=base+h;
  if(parapet&&h>9){const t=0.35,ph=0.7,pc=new THREE.Color(col).multiplyScalar(.85);
    [[w,t,(z0+t/2)],[w,t,(z1-t/2)]].forEach(([ww,tt,zz])=>{const p=new THREE.BoxGeometry(ww,ph,tt);p.translate((x0+x1)/2,top+ph/2,zz);addBGeo(p,pc,null,true);});
    [[x0+t/2],[x1-t/2]].forEach(([xx])=>{const p=new THREE.BoxGeometry(t,ph,d);p.translate(xx,top+ph/2,(z0+z1)/2);addBGeo(p,pc,null,true);});
    const nU=RI(1,3);for(let i=0;i<nU;i++){const uw=R(1.5,3),ud=R(1.5,3),uh=R(0.8,1.8);const u=new THREE.BoxGeometry(uw,uh,ud);u.translate(R(x0+2,x1-2-uw)+uw/2,top+uh/2,R(z0+2,z1-2-ud)+ud/2);addBGeo(u,0x9a9ca0,0x8a8c90,true);}
    if(h>22&&rnd()<.5){const tw=new THREE.CylinderGeometry(1.2,1.2,2.4,10);tw.translate(R(x0+3,x1-3),top+3.4,R(z0+3,z1-3));addBGeo(tw,0x7a5a3a,0x5a3a2a,true);}
  }
}
function addPitchedHouse(x0,x1,z0,z1,h,col,roofCol){
  addBuilding(x0,x1,z0,z1,h,col,null,{parapet:false});
  const w=x1-x0,d=z1-z0,rh=R(2,3.2),s=new THREE.Shape([new THREE.Vector2(-w/2-.3,0),new THREE.Vector2(w/2+.3,0),new THREE.Vector2(0,rh)]);
  const g=new THREE.ExtrudeGeometry(s,{depth:d+0.6,bevelEnabled:false});g.translate((x0+x1)/2,0.15+h,z0-0.3);
  addBGeo(g,col,roofCol,true);
}

// ============================================================ ground, roads, markings
const groundMat=new THREE.MeshStandardMaterial({map:grassTex,roughness:1});
grassTex.repeat.set(80,54);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(800,540),groundMat);ground.rotation.x=-Math.PI/2;ground.position.set(0,-0.02,QZ1-270);ground.receiveShadow=true;scene.add(ground);

function worldUV(g,s){const p=g.attributes.position,uv=g.attributes.uv;for(let i=0;i<p.count;i++)uv.setXY(i,p.getX(i)/s,p.getZ(i)/s);}
function flatPlane(w,d,x,y,z){const g=new THREE.PlaneGeometry(w,d);g.rotateX(-Math.PI/2);g.translate(x,y,z);return g;}

{ // roads
  const rg=[];for(const r of ROADS){rg.push(flatPlane(12,252,r,0,0));rg.push(flatPlane(252,12,0,0.001,r));}
  const g=mergeGeometries(rg);worldUV(g,10);
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:asphaltTex,roughness:.92,color:0xffffff}));m.receiveShadow=true;scene.add(m);
}
{ // markings
  const mk=[];const DIR=[[1,0],[0,1],[-1,0],[0,-1]];
  for(let a=0;a<5;a++)for(let b=0;b<4;b++){
    // segment along z on road x=ROADS[a] between z=ROADS[b]..ROADS[b+1]; and transposed
    for(const vert of [true,false]){
      const fixed=ROADS[a],z0=ROADS[b]+J,z1=ROADS[b+1]-J;
      for(let z=z0+1;z<z1-1;z+=6){const g=vert?flatPlane(.16,3,fixed,.02,z+1.5):flatPlane(3,.16,z+1.5,.02,fixed);mk.push(g);}
    }
  }
  // stop lines + zebras at each node approach
  for(const zx of ROADS)for(const zz of ROADS){
    const ix=ROADS.indexOf(zx),iz=ROADS.indexOf(zz);
    const dirs=[];if(ix<4)dirs.push(0);if(iz<4)dirs.push(1);if(ix>0)dirs.push(2);if(iz>0)dirs.push(3);
    for(const d of [0,1,2,3]){const back=(d+2)%4;if(!dirs.includes(back))continue; // approach from that side
      const [dx,dz]=DIR[d],lx=dz,lz=-dx;
      // stop line across the left lane
      const cx=zx-dx*J+lx*3,cz=zz-dz*J+lz*3;

  const moved=traffic.map((t,i)=>Math.hypot(t.v.x-t0[i][0],t.v.z-t0[i][1])).sort((a,b)=>a-b);
  const recent=traffic.map((t,i)=>Math.hypot(t.v.x-pos[i][0],t.v.z-pos[i][1])).sort((a,b)=>a-b);
  const pm=peds.map((p,i)=>Math.hypot(p.x-p0[i][0],p.z-p0[i][1])).sort((a,b)=>a-b);
  {const rr=traffic.map((t,i)=>[Math.hypot(t.v.x-pos[i][0],t.v.z-pos[i][1]),t]).sort((a,b)=>a[0]-b[0]).slice(0,3);for(const [d,t] of rr)log.push(['slow',+d.toFixed(1),'ph',t.phase,'s',+t.s.toFixed(1),'len',+t.len.toFixed(1),'dir',t.dir,'next',t.next,'node',t.end.ix,t.end.iz,'go',t.go,'lat',+t.lat.toFixed(1),'xz',+t.v.x.toFixed(1),+t.v.z.toFixed(1),'occ',t.end.occ.size,'gap',+gapAhead(t.v,t.v.x,t.v.z,DIRV[t.dir][0],DIRV[t.dir][1],32).toFixed(1),gapNT]);}
  log.push(['player_car',+startCar.x.toFixed(1),+startCar.z.toFixed(1),+startCar.heading.toFixed(2),'walking',player.walking]);
  log.push(['traffic_disp_min_med_max',+moved[0].toFixed(1),+moved[moved.length>>1].toFixed(1),+moved[moved.length-1].toFixed(1)]);
  log.push(['traffic_last60s_disp_min_med',+recent[0].toFixed(1),+recent[recent.length>>1].toFixed(1)],['traffic_max_close_pairs',maxOv]);
  log.push(['traffic_finite',traffic.every(t=>isFinite(t.v.x)&&isFinite(t.v.z))],['peds_moved_min_med',+pm[0].toFixed(1),+pm[pm.length>>1].toFixed(1)]);
  log.push(['peds_in_lot',peds.filter(p=>p.lot&&Math.abs(p.x-p.lot.cx)<19.9&&Math.abs(p.z-p.lot.cz)<19.9).length],['phases',traffic.map(t=>t.phase+':'+t.speed.toFixed(1)).join(' ')]);
  // pedestrian dodge test: aim player car at a ped
  run(.1);if(player.walking)onKey('KeyE');const ped=peds[0];const sp=Math.hypot;startCar.x=ped.x-Math.sin(0)*0;startCar.z=ped.z-25;startCar.heading=0;startCar.vx=0;startCar.vz=14;startCar.spin=0;
  let minD=99;for(let i=0;i<150;i++){step(1/60,false);minD=Math.min(minD,sp(ped.x-startCar.x,ped.z-startCar.z));}
  log.push(['ped_min_dist_to_charging_car',+minD.toFixed(2),'ped_alarm',+ped.alarm.toFixed(2)]);
  log.push(['sim_seconds',+simT.toFixed(1)],['hours',+hours.toFixed(2)]);
  const pre=document.createElement('pre');pre.id='selftest';pre.textContent=JSON.stringify(log);document.body.appendChild(pre);
}
document.getElementById('loading').remove();
frame();
setTimeout(()=>{if(helpVisible){helpVisible=false;document.getElementById('help').style.opacity=0;}},25000);
window.__town={vehicles,traffic,peds,player,nodes,get hours(){return hours},set hours(v){hours=v}};
</script>

  window.addEventListener('error',e=>{const l=document.getElementById('ltxt');if(l)l.textContent='Could not start: '+e.message+' (needs WebGL)';});
