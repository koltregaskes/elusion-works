<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Meadow</title>
<style>
  :root { --ink: rgba(255,248,235,0.92); --dim: rgba(255,248,235,0.55); --glass: rgba(18,14,10,0.34); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas#c { display: block; width: 100vw; height: 100vh; outline: none; cursor: grab; touch-action: none; }
  body.walk canvas#c { cursor: crosshair; }
  #ui { position: fixed; inset: 0; pointer-events: none; color: var(--ink);
        font: 13px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: opacity .6s; }
  #ui.hidden { opacity: 0; visibility: hidden; }
  #showUI { position: fixed; bottom: 16px; left: 16px; color: #fff8eb; background: #241c14; border: 1px solid #a18b6f; min-height: 36px; }
  #showUI[hidden] { display: none; }
  #title { position: absolute; left: 34px; top: 28px; text-shadow: 0 1px 12px rgba(0,0,0,.45); transition: opacity 1.4s; }
  #title .t1 { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 30px;
               letter-spacing: .32em; text-transform: uppercase; font-weight: 400; }
  #title .t2 { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-style: italic;
               font-size: 16px; color: var(--dim); margin-top: 6px; letter-spacing: .04em; transition: opacity .5s; }
  #bar { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 10px;
         flex-wrap: wrap; justify-content: center; pointer-events: auto; max-width: calc(100vw - 32px); }
  .grp { display: flex; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 42px); gap: 2px; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
         border: 1px solid rgba(255,240,220,.14); border-radius: 999px; padding: 3px; }
  button { all: unset; cursor: pointer; padding: 7px 13px; border-radius: 999px; color: var(--dim); white-space: nowrap;
           transition: background .25s, color .25s; font-size: 12.5px; letter-spacing: .02em; }
  button:hover { color: var(--ink); background: rgba(255,240,220,.08); }
  button.on { color: #1b140c; background: rgba(255,236,205,.88); }
  button kbd { font: inherit; font-size: 10px; opacity: .55; margin-left: 7px; }
  #hint { position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%); color: var(--ink); font-size: 12.5px;
          letter-spacing: .03em; background: var(--glass); padding: 7px 14px; border-radius: 999px; transition: opacity 1s;
          backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); white-space: nowrap; max-width: calc(100vw - 32px);
          overflow: hidden; text-overflow: ellipsis; }
  #stats { position: absolute; right: 18px; top: 16px; font: 11px/1.4 ui-monospace, Consolas, monospace; color: var(--dim);
           text-align: right; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #eee; font: 15px system-ui; background: #111; text-align: center; padding: 20px; }
  @media (max-width: 640px) { #title { left: 16px; top: 16px; } #title .t1 { font-size: 21px; } button { padding: 6px 9px; } button kbd { display: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "../_shared/three-r160/build/three.module.js",
  "three/addons/": "../_shared/three-r160/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="ui">
  <div id="title"><div class="t1">The Meadow</div><div class="t2" id="moodName">Golden hour</div></div>
  <div id="stats"></div>
  <div id="hint">Sound is off. Click anywhere to turn it on.</div>
  <div id="bar">
    <div class="grp" id="moods">
      <button data-m="0" class="on">Golden hour<kbd>1</kbd></button>
      <button data-m="1">Overcast storm<kbd>2</kbd></button>
      <button data-m="2">Moonlit night<kbd>3</kbd></button>
      <button data-m="3">Misty dawn<kbd>4</kbd></button>
    </div>
    <div class="grp">
      <button id="camBtn" class="on">Cinematic<kbd>C</kbd></button>
      <button id="sndBtn">Sound off<kbd>M</kbd></button>
      <button id="hideBtn">Hide UI<kbd>H</kbd></button>
    </div>
  </div>
</div>
<button id="showUI" hidden>Show UI</button>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const V3 = THREE.Vector3;
// ---------------------------------------------------------------- seeded random
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(20261110);

// ---------------------------------------------------------------- shared world functions (JS mirror of GLSL)
const fract = x => x - Math.floor(x);
const sstep = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
function hash12(x, y){ let a = fract(x*.1031), b = fract(y*.1031), c = fract(x*.1031);
  const d = a*(b+33.33) + b*(c+33.33) + c*(a+33.33); a += d; b += d; c += d; return fract((a + b) * c); }
function vnoise(x, y){ const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx*fx*(3-2*fx), uy = fy*fy*(3-2*fy);
  const a = hash12(ix, iy), b = hash12(ix+1, iy), c = hash12(ix, iy+1), d = hash12(ix+1, iy+1);
  return (a + (b-a)*ux) + ((c + (d-c)*ux) - (a + (b-a)*ux)) * uy; }
function terrainH(x, z){
  let h = 1.6*Math.sin(x*0.021+0.5)*Math.cos(z*0.017) + 0.9*Math.sin(x*0.047 - z*0.033 + 1.3) + 0.35*Math.sin(x*0.11 + z*0.09);
  const dx = x - 4, dz = z + 36; h += 7.5*Math.exp(-(dx*dx + dz*dz)/1152);
  h += 14*sstep(170, 320, Math.hypot(x, z));
  return h;
}
const pathX = z => 2 + 7*Math.sin(z*0.04 + 1.2);

const GLSL_COMMON = /* glsl */`
uniform float uTime; uniform float uWindPhase; uniform float uWind; uniform vec2 uWindDir;
uniform vec3 uSunDir; uniform vec3 uSunColor; uniform vec3 uSkyAmb; uniform vec3 uGroundAmb;
uniform vec3 uFogColor; uniform vec3 uFogSun; uniform float uFogDensity;
uniform vec3 uCam; uniform float uCloudCover; uniform float uCloudShadow; uniform float uShadowStr; uniform float uFlash;
uniform vec3 uTreePos; uniform vec3 uCanopy; uniform vec2 uCloudOffset;

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
float hash13(vec3 p3){ p3 = fract(p3*0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p); vec2 f = fract(p); vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash12(i), hash12(i+vec2(1.0,0.0)), u.x), mix(hash12(i+vec2(0.0,1.0)), hash12(i+vec2(1.0,1.0)), u.x), u.y); }
float fbm(vec2 p){ float s = 0.0; float a = 0.5; for (int i = 0; i < 4; i++){ s += a*vnoise(p); p = p*2.03 + vec2(17.1, 9.2); a *= 0.5; } return s; }
float terrainH(vec2 p){
  float h = 1.6*sin(p.x*0.021+0.5)*cos(p.y*0.017) + 0.9*sin(p.x*0.047 - p.y*0.033 + 1.3) + 0.35*sin(p.x*0.11 + p.y*0.09);
  vec2 d = p - vec2(4.0, -36.0); h += 7.5*exp(-dot(d,d)/1152.0);
  h += 14.0*smoothstep(170.0, 320.0, length(p));
  return h;
}
float pathX(float z){ return 2.0 + 7.0*sin(z*0.04 + 1.2); }
float pathMask(vec2 p){
  float d = abs(p.x - pathX(p.y)); float w = 0.85 + 0.25*sin(p.y*0.3);
  float m = 1.0 - smoothstep(w, w + 0.7, d);
  return m * smoothstep(-35.0, -29.0, p.y) * (1.0 - smoothstep(150.0, 170.0, p.y));
}
float wheatMask(vec2 p){
  float edge = pathX(p.y) - 1.9 + 0.8*sin(p.y*0.21);
  float m = 1.0 - smoothstep(edge - 1.2, edge, p.x);
  m *= smoothstep(-26.0, -18.0, p.y + 3.0*sin(p.x*0.1));
  m *= smoothstep(-130.0, -118.0, p.x);
  m *= 1.0 - smoothstep(125.0, 140.0, p.y);
  return m;
}
float windField(vec2 p){
  vec2 wd = uWindDir; vec2 pr = vec2(-wd.y, wd.x);
  float a = dot(p, wd); float b = dot(p, pr);
  float g = sin(a*0.11 - uWindPhase*0.11 + sin(b*0.05)*1.5)*0.5 + 0.5; g *= g;
  float n = vnoise(vec2(a*0.03 - uWindPhase*0.03, b*0.04));
  return uWind*(0.3 + 0.7*(g*0.6 + n*0.4));
}
float cloudDensity(vec2 uv){
  float n = fbm(uv*1.5 + uCloudOffset) + 0.5*fbm(uv*4.1 - uCloudOffset*1.7) - 0.25;
  return smoothstep(1.0 - uCloudCover - 0.05, 1.0 - uCloudCover + 0.35, n);
}
float cloudShadow(vec2 p){
  vec2 uv = (p + uSunDir.xz/max(uSunDir.y, 0.12)*400.0)/400.0;
  return 1.0 - uCloudShadow*cloudDensity(uv);
}
float treeShadow(vec3 p){
  vec3 L = uSunDir; vec3 C = uCanopy;
  float t = dot(C - p, L);
  float s = 0.0;
  if (t > 0.0) {
    vec3 q = p + L*t - C; q.y *= 1.4;
    float n = vnoise(q.xz*0.8 + q.y*0.6)*0.6 + vnoise(q.xz*2.2 + 3.0)*0.4;
    s = 1.0 - smoothstep(4.6, 7.6, length(q) + (n - 0.5)*3.5);
  }
  vec2 Lh = L.xz; float tt = dot(uTreePos.xz - p.xz, Lh)/max(dot(Lh, Lh), 1e-4);
  vec3 pt = p + L*tt; float dt = length(pt.xz - uTreePos.xz); float hr = pt.y - uTreePos.y;
  float tr = (1.0 - smoothstep(0.45, 0.75, dt)) * step(0.0, tt) * step(-0.5, hr) * (1.0 - step(4.2, hr));
  s = max(s, tr);
  return 1.0 - s*uShadowStr*0.88;
}
vec3 fogCol(vec3 rd){ float s = pow(max(dot(rd, uSunDir), 0.0), 8.0); return mix(uFogColor, uFogSun, s); }
vec3 applyFog(vec3 col, vec3 wpos){ vec3 v = wpos - uCam; float d = length(v); float f = 1.0 - exp(-d*uFogDensity); return mix(col, fogCol(v/max(d,1e-3)), f); }
`;

const FOG_STD = /* glsl */`
{ float fd = length(vViewPosition); vec3 rdv = normalize(-vViewPosition);
  vec3 sv = normalize((viewMatrix*vec4(uSunDir, 0.0)).xyz);
  float ss = pow(max(dot(rdv, sv), 0.0), 8.0); vec3 fc = mix(uFogColor, uFogSun, ss);
  float ff = 1.0 - exp(-fd*uFogDensity); gl_FragColor.rgb = mix(gl_FragColor.rgb, fc, ff); }
`;

// ---------------------------------------------------------------- shared uniforms
const U = {
  uTime:{value:0}, uWindPhase:{value:0}, uWind:{value:1}, uWindDir:{value:new THREE.Vector2(1,0)},
  uSunDir:{value:new V3(0,1,0)}, uSunColor:{value:new THREE.Color()}, uSkyAmb:{value:new THREE.Color()}, uGroundAmb:{value:new THREE.Color()},
  uFogColor:{value:new THREE.Color()}, uFogSun:{value:new THREE.Color()}, uFogDensity:{value:0.004},
  uCam:{value:new V3()}, uCloudCover:{value:0.3}, uCloudShadow:{value:0.3}, uShadowStr:{value:1}, uFlash:{value:0},
  uTreePos:{value:new V3()}, uCanopy:{value:new V3()}, uCloudOffset:{value:new THREE.Vector2()}
};

function patchStd(mat, hooks = {}){
  mat.fog = false;
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, U);
    let vs = GLSL_COMMON + sh.vertexShader, fs = GLSL_COMMON + sh.fragmentShader.replace('#include <fog_fragment>', FOG_STD);
    if (hooks.vs) vs = hooks.vs(vs);
    if (hooks.fs) fs = hooks.fs(fs);
    sh.vertexShader = vs; sh.fragmentShader = fs;
  };
  return mat;
}

// ---------------------------------------------------------------- renderer / scene / camera
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  const el = document.getElementById('err'); el.style.display = 'grid'; el.textContent = 'This scene needs WebGL 2, which is not available in this browser.'; throw e;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const DPR = Math.min(window.devicePixelRatio || 1, 2);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 0.1, 3000);
camera.rotation.order = 'YXZ';

// ---------------------------------------------------------------- terrain
const TREE_XZ = [6, -38];
const treeBase = new V3(TREE_XZ[0], terrainH(TREE_XZ[0], TREE_XZ[1]) - 0.25, TREE_XZ[1]);
U.uTreePos.value.copy(treeBase);
{
  const tg = new THREE.PlaneGeometry(900, 900, 300, 300); tg.rotateX(-Math.PI/2);
  const p = tg.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, terrainH(p.getX(i), p.getZ(i)));
  tg.computeVertexNormals();
  const tm = patchStd(new THREE.MeshStandardMaterial({ roughness: 1, metalness: 0 }), {
    vs: s => s.replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
              .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWPos = (modelMatrix*vec4(transformed,1.0)).xyz;'),
    fs: s => s.replace('#include <common>', `#include <common>
varying vec3 vWPos;
vec3 terrainAlbedo(vec3 p){
  float dCam = length(p.xz - uCam.xz);
  float far = smoothstep(14.0, 70.0, dCam);
  float n = fbm(p.xz*0.15); float n2 = vnoise(p.xz*0.03);
  vec3 gNear = mix(vec3(0.045,0.055,0.016), vec3(0.075,0.068,0.025), n);
  float dry = smoothstep(0.35, 0.75, vnoise(p.xz*0.045 + 7.0));
  vec3 gFar = mix(vec3(0.10,0.14,0.035), vec3(0.20,0.17,0.065), dry*0.8 + n2*0.3);
  vec3 col = mix(gNear, gFar, far);
  vec3 wheat = mix(vec3(0.16,0.11,0.04), vec3(0.36,0.26,0.10), smoothstep(6.0, 50.0, dCam)*(0.7 + 0.3*n));
  col = mix(col, wheat, wheatMask(p.xz));
  float pm = pathMask(p.xz);
  col = mix(col, vec3(0.16,0.12,0.075)*(0.75 + 0.5*n), pm);
  float w = windField(p.xz);
  col *= 1.0 + 0.45*(w/(uWind + 0.01) - 0.55)*far*(1.0 - pm);
  return col * cloudShadow(p.xz);
}`).replace('#include <color_fragment>', 'diffuseColor.rgb = terrainAlbedo(vWPos);')
  });
  const terrain = new THREE.Mesh(tg, tm); terrain.receiveShadow = true; scene.add(terrain);
}

// ---------------------------------------------------------------- sky dome
const skyU = {
  uZenith:{value:new THREE.Color()}, uHorizon:{value:new THREE.Color()}, uGlow:{value:new THREE.Color()},
  uCloudLit:{value:new THREE.Color()}, uCloudDark:{value:new THREE.Color()},
  uSunDisc:{value:1}, uMoon:{value:0}, uStars:{value:0}
};
{
  const sm = new THREE.ShaderMaterial({
    uniforms: Object.assign({}, U, skyU), depthWrite: false, depthTest: false, side: THREE.BackSide,
    vertexShader: GLSL_COMMON + `varying vec3 vDir;
      void main(){ vDir = position; gl_Position = projectionMatrix * viewMatrix * vec4(position + uCam, 1.0); gl_Position.z = gl_Position.w*0.99999; }`,
    fragmentShader: GLSL_COMMON + `
      uniform vec3 uZenith; uniform vec3 uHorizon; uniform vec3 uGlow; uniform vec3 uCloudLit; uniform vec3 uCloudDark;
      uniform float uSunDisc; uniform float uMoon; uniform float uStars;
      varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir); float y = d.y; float yy = max(y, 0.0);
        float mu = dot(d, uSunDir); float m = max(mu, 0.0);
        vec3 col = mix(uHorizon, uZenith, pow(yy, 0.4));
        col += uGlow*(0.08*pow(m, 3.0) + 0.4*pow(m, 24.0) + 2.5*pow(m, 400.0))*(0.25 + 0.75*uSunDisc + 0.35*uMoon);
        float ang = acos(clamp(mu, -1.0, 1.0));
        col += uGlow*32.0*(1.0 - smoothstep(0.0085, 0.0105, ang))*uSunDisc;
        if (uMoon > 0.001) {
          float md = 1.0 - smoothstep(0.024, 0.0265, ang);
          vec3 up = abs(uSunDir.y) < 0.99 ? vec3(0.0,1.0,0.0) : vec3(1.0,0.0,0.0);
          vec3 mx = normalize(cross(up, uSunDir)); vec3 my = cross(uSunDir, mx);
          vec2 mc = vec2(dot(d, mx), dot(d, my))*60.0;
          float cr = 0.78 + 0.22*vnoise(mc*1.5) - 0.18*smoothstep(0.55, 0.7, vnoise(mc*0.7 + 4.0));
          col += vec3(1.0, 0.96, 0.88)*2.6*cr*md*uMoon;
        }
        if (uStars > 0.001 && y > 0.0) {
          vec3 sd = d*220.0; vec3 cell = floor(sd); float h = hash13(cell);
          if (h > 0.9965) {
            vec3 f = fract(sd) - 0.5; float b = (h - 0.9965)/0.0035;
            float s = 1.0 - smoothstep(0.0, 0.12 + 0.14*b, length(f));
            float tw = 0.55 + 0.45*sin(uTime*(1.5 + b*3.0) + h*500.0);
            col += vec3(0.8, 0.86, 1.0)*s*(0.3 + b)*tw*1.6*uStars*smoothstep(0.0, 0.25, y);
          }
        }
        if (y > 0.0) {
          vec2 uv = d.xz/(y + 0.1);
          float cd = cloudDensity(uv);
          float cd2 = cloudDensity(uv + uSunDir.xz*0.12);
          float lit = clamp(1.0 - cd2*0.9 + (1.0 - cd)*0.3, 0.0, 1.0);
          vec3 cc = mix(uCloudDark, uCloudLit, lit);
          cc += uGlow*pow(m, 4.0)*(1.0 - cd)*1.4*(uSunDisc + 0.4*uMoon);
          cc += vec3(0.7, 0.75, 0.95)*uFlash*(0.4 + 1.8*cd);
          col = mix(col, cc, cd*smoothstep(0.0, 0.12, y)*0.96);
        }
        col += vec3(0.5, 0.55, 0.7)*uFlash*0.25;
        float hf = 1.0 - smoothstep(-0.02, 0.1, y);
        col = mix(col, fogCol(d), hf*0.92);
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 48, 24), sm);
  sky.frustumCulled = false; sky.renderOrder = -1000; scene.add(sky);
}

// ---------------------------------------------------------------- grass and wheat (camera-wrapped instanced fields)
const FIELD_VS = GLSL_COMMON + /* glsl */`
attribute vec4 iData;
uniform float uTile; uniform float uFadeIn; uniform float uFadeOut; uniform float uScale; uniform float uKind; uniform float uWidth; uniform float uWidthMul;
varying vec3 vW; varying vec3 vAlb; varying float vY; varying vec3 vN; varying float vSh; varying float vBend;
void main(){
  vec2 cam = uCam.xz;
  vec2 wp = cam + mod(iData.xy - cam + uTile*0.5, uTile) - uTile*0.5;
  float r1 = iData.z; float r2 = iData.w;
  float d = length(wp - cam);
  float fade = 1.0 - smoothstep(uFadeOut*0.72, uFadeOut, d);
  if (uFadeIn > 0.0) fade *= smoothstep(uFadeIn*0.65, uFadeIn, d);
  float wm = wheatMask(wp); float pm = pathMask(wp);
  float dens = uKind < 0.5 ? (1.0 - pm)*mix(1.0, 0.1, wm) : wm*(1.0 - pm);
  float dTree = length(wp - uTreePos.xz);
  dens *= smoothstep(0.9, 1.7, dTree);
  float keep = step(fract(r1*7.13 + r2*3.71), dens);
  float patchN = vnoise(wp*0.09);
  float h;
  if (uKind < 0.5) { h = (0.26 + 0.55*patchN + 0.32*r2) * mix(0.5, 1.0, smoothstep(3.0, 13.0, dTree)); }
  else { h = 0.95 + 0.2*r2 + 0.12*patchN; }
  h *= uScale*fade*keep;
  float ang = r1*6.2831853;
  vec2 ac = vec2(cos(ang), sin(ang));
  vec3 lp = position; float y = lp.y;
  float w = windField(wp);
  float flut = sin(uTime*(1.7 + r2*2.3) + r1*50.0)*(0.05 + 0.07*uWind);
  float bend = clamp(w*(uKind < 0.5 ? 0.9 : 0.6) + flut + (r2 - 0.5)*0.2, -0.6, 1.6);
  float curve = pow(y, 1.6);
  vec2 lean = uWindDir*bend*curve*h + vec2(cos(r2*40.0), sin(r2*40.0))*0.14*curve*h;
  float py = y*h*(1.0 - 0.3*bend*bend*curve);
  float wdt = (uKind < 0.5 ? uWidth*(0.7 + 0.6*r2) : uWidth)*uWidthMul;
  vec2 across = vec2(lp.x*ac.x - lp.z*ac.y, lp.x*ac.y + lp.z*ac.x)*wdt;
  vec3 world = vec3(wp.x + across.x + lean.x, terrainH(wp) + py - 0.03, wp.y + across.y + lean.y);
  vW = world; vY = y; vBend = w;
  vN = normalize(vec3(-ac.y, 0.35, ac.x));
  vec3 alb;
  if (uKind < 0.5) {
    float dry = smoothstep(0.35, 0.75, vnoise(wp*0.045 + 7.0));

    if (st.crickets > 0.03){
      for (const c of this.crickets){
        if (c.next < t) c.next = t + Math.random()*c.period;
        while (c.next < t + 0.2){ this.cricket(c, c.next, c.vol*st.crickets); c.next += c.period*(0.95 + Math.random()*0.1); }
      }
    }
  }
};

// ---------------------------------------------------------------- camera: cinematic shots and walking
const SHOTS = [
  { a:[-9, 1.15, 47],  b:[-7.5, 1.2, 37],  la:[7, 5.0, -38],  lb:[7, 5.0, -38],  fov:30, dur:15 },
  { a:[-24, 1.3, 14],  b:[-13, 1.35, 5],   la:[-2, 1.0, -14], lb:[4, 1.6, -26],  fov:42, dur:13 },
  { a:[30, 1.3, -12],  b:[25, 6.5, -5],    la:[6, 5.5, -38],  lb:[6, 5.5, -38],  fov:38, dur:14 },
  { a:[9.5, 1.6, -33], b:[3.5, 1.8, -31],  la:[-28, 1.5, 40], lb:[-40, 2.5, 28], fov:50, dur:13 },
  { a:[-70, 18, 80],   b:[-56, 16, 92],    la:[6, 4, -38],    lb:[6, 4, -38],    fov:30, dur:14 },
  { a:[2.6, 0.45, 22], b:[4.2, 0.5, 14],   la:[5, 0.9, 0],    lb:[5.5, 1.8, -20],fov:55, dur:13 }
];
let camMode = 'cine', shotIdx = 0, shotT = 0;
const walk = { yaw: 0, pitch: 0, vel: new V3(), y: 0, bob: 0 };
const tmpA = new V3(), tmpB = new V3(), look = new V3();
const ease = x => x*x*(3 - 2*x);
function shotPose(s, k, out, lookOut){
  const e = ease(k);
  out.set(s.a[0] + (s.b[0] - s.a[0])*e, 0, s.a[2] + (s.b[2] - s.a[2])*e);
  out.y = terrainH(out.x, out.z) + s.a[1] + (s.b[1] - s.a[1])*e;
  lookOut.set(s.la[0] + (s.lb[0] - s.la[0])*e, 0, s.la[2] + (s.lb[2] - s.la[2])*e);
  lookOut.y = terrainH(lookOut.x, lookOut.z) + s.la[1] + (s.lb[1] - s.la[1])*e;
}
function updateCine(dt, t){
  const s = SHOTS[shotIdx];
  shotT += dt;
  if (shotT > s.dur){ shotT = 0; shotIdx = (shotIdx + 1) % SHOTS.length; return updateCine(0, t); }
  const k = shotT/s.dur;
  shotPose(s, k, tmpA, look);
  camera.position.copy(tmpA);
  camera.fov = s.fov; camera.updateProjectionMatrix();
  camera.lookAt(look);
  camera.rotateX(Math.sin(t*0.53)*0.0025 + Math.sin(t*1.31)*0.001);
  camera.rotateY(Math.sin(t*0.41 + 1)*0.003);
  const fadeIn = Math.min(shotT/0.9, 1), fadeOut = Math.min((s.dur - shotT)/0.9, 1);
  return 1 - Math.min(fadeIn, fadeOut);
}
function enterWalk(){
  if (camMode === 'walk') return;
  camMode = 'walk';
  const d = new V3(); camera.getWorldDirection(d);
  walk.yaw = Math.atan2(-d.x, -d.z); walk.pitch = Math.asin(THREE.MathUtils.clamp(d.y, -1, 1));
  walk.y = camera.position.y;
  camera.fov = 60; camera.updateProjectionMatrix();
  document.body.classList.add('walk'); syncUI();
}
function enterCine(){
  camMode = 'cine'; shotT = 0; shotIdx = (shotIdx + 1) % SHOTS.length;
  if (document.pointerLockElement) document.exitPointerLock();
  document.body.classList.remove('walk'); syncUI();
}
const keys = {};
function updateWalk(dt, t){
  const run = keys.ShiftLeft || keys.ShiftRight;
  const sp = run ? 8 : 3.2;
  const f = new V3(-Math.sin(walk.yaw), 0, -Math.cos(walk.yaw)), r = new V3(Math.cos(walk.yaw), 0, -Math.sin(walk.yaw));
  const want = new V3();
  if (keys.KeyW || keys.ArrowUp) want.add(f); if (keys.KeyS || keys.ArrowDown) want.sub(f);
  if (keys.KeyD || keys.ArrowRight) want.add(r); if (keys.KeyA || keys.ArrowLeft) want.sub(r);
  if (want.lengthSq() > 0) want.normalize().multiplyScalar(sp);
  walk.vel.lerp(want, 1 - Math.exp(-dt*6));
  camera.position.addScaledVector(walk.vel, dt);
  // keep out of the trunk and inside the world
  const dx = camera.position.x - treeBase.x, dz = camera.position.z - treeBase.z, dd = Math.hypot(dx, dz);
  if (dd < 1.4){ camera.position.x = treeBase.x + dx/dd*1.4; camera.position.z = treeBase.z + dz/dd*1.4; }
  const rr = Math.hypot(camera.position.x, camera.position.z);
  if (rr > 200){ camera.position.x *= 200/rr; camera.position.z *= 200/rr; }
  const speed = walk.vel.length();
  walk.bob += dt*speed*2.1;
  const ground = terrainH(camera.position.x, camera.position.z) + 1.65 + Math.sin(walk.bob)*0.03*Math.min(speed/3, 1);
  walk.y += (ground - walk.y)*(1 - Math.exp(-dt*10));
  camera.position.y = walk.y;
  camera.rotation.set(walk.pitch, walk.yaw, 0);
  return 0;
}

// ---------------------------------------------------------------- UI
const ui = document.getElementById('ui'), hint = document.getElementById('hint'), statsEl = document.getElementById('stats');
const moodName = document.getElementById('moodName'), titleEl = document.getElementById('title');
const camBtn = document.getElementById('camBtn'), sndBtn = document.getElementById('sndBtn');
function syncUI(){
  document.querySelectorAll('#moods button').forEach(b => b.classList.toggle('on', +b.dataset.m === moodIdx));
  camBtn.innerHTML = (camMode === 'cine' ? 'Cinematic' : 'Walking') + '<kbd>C</kbd>';
  camBtn.classList.toggle('on', camMode === 'cine');
  sndBtn.innerHTML = (Sound.on ? 'Sound on' : 'Sound off') + '<kbd>M</kbd>';
  sndBtn.classList.toggle('on', Sound.on);
}
let titleTimer = 0;
function setMood(i){
  moodIdx = i; moodName.textContent = MOODS[i].name; moodName.style.opacity = 1;
  titleEl.style.opacity = 1; titleTimer = 7;
  syncUI();
}
let hintTimer = -1;
function showHint(text, secs){ hint.textContent = text; hint.style.opacity = 1; hintTimer = secs; }
function setSound(v){
  Sound.toggle(v); syncUI();
  if (v && hintTimer < 0) showHint(camMode === 'cine' ? 'W A S D to walk  ·  C for the cinematic camera  ·  1 to 4 for moods' : 'Click to look with the mouse  ·  W A S D to walk  ·  Shift to run', 6);
}
document.querySelectorAll('#moods button').forEach(b => b.addEventListener('click', () => setMood(+b.dataset.m)));
camBtn.addEventListener('click', () => camMode === 'cine' ? enterWalk() : enterCine());
sndBtn.addEventListener('click', () => setSound(!Sound.on));
const showUI = document.getElementById('showUI');
function setUIHidden(hidden) {
  ui.classList.toggle('hidden', hidden);
  ui.inert = hidden;
  showUI.hidden = !hidden;
  if (hidden) showUI.focus();
  else document.getElementById('hideBtn').focus();
}
document.getElementById('hideBtn').addEventListener('click', () => setUIHidden(true));
showUI.addEventListener('click', () => setUIHidden(false));
window.addEventListener('pointerdown', e => { if (!Sound.ctx && !e.target.closest('button')) setSound(true); }, true);

let dragging = false, dragDist = 0, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e => {
  dragging = true; dragDist = 0; lastX = e.clientX; lastY = e.clientY;
  if (camMode === 'walk' && e.pointerType === 'mouse' && !document.pointerLockElement){
    try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (_) {}
  }
});
window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('pointermove', e => {
  if (document.pointerLockElement === canvas){
    walk.yaw -= e.movementX*0.0022; walk.pitch -= e.movementY*0.0022;
  } else if (dragging){
    const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
    dragDist += Math.abs(dx) + Math.abs(dy);
    if (camMode === 'cine'){ if (dragDist > 8) enterWalk(); else return; }
    walk.yaw -= dx*0.004; walk.pitch -= dy*0.004;
  }
  walk.pitch = THREE.MathUtils.clamp(walk.pitch, -1.3, 1.3);
});
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)){ if (camMode === 'cine') enterWalk(); e.preventDefault(); }
  if (e.repeat) return;
  if (e.code >= 'Digit1' && e.code <= 'Digit4') setMood(+e.code.slice(5) - 1);
  if (e.code === 'KeyC') camMode === 'cine' ? enterWalk() : enterCine();
  if (e.code === 'KeyM') setSound(!Sound.on);
  if (e.code === 'KeyH') setUIHidden(!ui.classList.contains('hidden'));
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function onResize(){
  const w = innerWidth, h = innerHeight;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w, h, false); composer.setSize(w, h);
  godPass.uniforms.uAspect.value = w/h; gradePass.uniforms.uAspect.value = w/h;
  const pr = renderer.getPixelRatio();
  gradePass.uniforms.uRes.value.set(w*pr, h*pr);
}
window.addEventListener('resize', onResize);

// ---------------------------------------------------------------- main loop
const clock = new THREE.Clock();
let time = 0, windPhase = 0, flash = 0, lightningT = 5, fade = 0, letterbox = 1;
const pulses = [];
const tmpC = new THREE.Color(), sunScreen = new V3(), camDir = new V3();
function windAt(x, z){
  const wd = U.uWindDir.value, W = U.uWind.value;
  const a = x*wd.x + z*wd.y, b = -x*wd.y + z*wd.x;
  let g = Math.sin(a*0.11 - windPhase*0.11 + Math.sin(b*0.05)*1.5)*0.5 + 0.5; g *= g;
  const n = vnoise(a*0.03 - windPhase*0.03, b*0.04);
  return W*(0.3 + 0.7*(g*0.6 + n*0.4));
}

function frame(){
  const dt = Math.min(clock.getDelta(), 0.1);
  time += dt;
  perfTick(dt, time);

  // mood blend
  lerpState(cur, STATES[moodIdx], 1 - Math.exp(-dt/1.4));

  // wind
  const W = cur.wind*(0.8 + 0.3*Math.sin(time*0.17)*Math.sin(time*0.061 + 2) + 0.1*Math.sin(time*0.53));
  windPhase += dt*(3 + 4*W);
  U.uTime.value = time; U.uWindPhase.value = windPhase; U.uWind.value = W;
  U.uWindDir.value.set(cur.windDir.x, cur.windDir.z).normalize();
  U.uCloudOffset.value.addScaledVector(U.uWindDir.value, -dt*(0.004 + 0.012*W));

  // lightning
  if (cur.lightning > 0.5){
    lightningT -= dt;
    if (lightningT <= 0){
      const n = 1 + Math.floor(rnd()*3);
      for (let i = 0; i < n; i++) pulses.push({ t: time + i*(0.07 + rnd()*0.12), a: 0.7 + rnd()*1.3 });
      if (Sound.on) Sound.thunder(0.2 + rnd()*0.8);
      lightningT = 6 + rnd()*12;
    }
  }
  for (let i = pulses.length - 1; i >= 0; i--) if (pulses[i].t <= time){ flash = Math.max(flash, pulses[i].a); pulses.splice(i, 1); }
  flash *= Math.exp(-dt*11);
  U.uFlash.value = flash*cur.lightning;

  // camera
  const cutFade = camMode === 'cine' ? updateCine(dt, time) : updateWalk(dt, time);
  fade += ((time < 0.4 ? 1 : cutFade) - fade)*(1 - Math.exp(-dt*(time < 3 ? 1.6 : 12)));
  letterbox += ((camMode === 'cine' ? 1 : 0) - letterbox)*(1 - Math.exp(-dt*3));
  U.uCam.value.copy(camera.position);

  // lights
  U.uSunDir.value.copy(cur.sunDir);
  U.uSunColor.value.copy(cur.sunColor).multiplyScalar(cur.sunI);
  U.uSkyAmb.value.copy(cur.skyAmb).multiplyScalar(cur.hemiI + U.uFlash.value*0.8);
  U.uGroundAmb.value.copy(cur.groundAmb).multiplyScalar(cur.hemiI + U.uFlash.value*0.3);
  U.uFogColor.value.copy(cur.fog); U.uFogSun.value.copy(cur.fogSun); U.uFogDensity.value = cur.fogDensity;
  U.uCloudCover.value = cur.cloudCover; U.uCloudShadow.value = cur.cloudShadow; U.uShadowStr.value = cur.shadowStr;
  sun.position.copy(canopyCenter).addScaledVector(cur.sunDir, 160); sun.target.position.copy(canopyCenter);
  sun.color.copy(cur.sunColor); sun.intensity = cur.sunI*Math.PI*(0.15 + 0.85*cur.shadowStr) ;
  hemi.color.copy(cur.skyAmb); hemi.groundColor.copy(cur.groundAmb); hemi.intensity = (cur.hemiI + U.uFlash.value*0.8)*Math.PI;
  skyU.uZenith.value.copy(cur.zenith); skyU.uHorizon.value.copy(cur.horizon); skyU.uGlow.value.copy(cur.glow);
  skyU.uCloudLit.value.copy(cur.cloudLit); skyU.uCloudDark.value.copy(cur.cloudDark);
  skyU.uSunDisc.value = cur.sunDisc; skyU.uMoon.value = cur.moon; skyU.uStars.value = cur.stars;
  pollenU.uPollen.value = cur.pollen; fireU.uFire.value = cur.fire; rainU.uRain.value = cur.rain;
  rain.visible = cur.rain > 0.01; fireflies.visible = cur.fire > 0.01; pollen.visible = cur.pollen > 0.01;
  pxU.uPx.value = renderer.domElement.height/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2));
  renderer.toneMappingExposure = cur.exposure;

  // post
  bloomPass.strength = cur.bloom;
  camera.getWorldDirection(camDir);
  sunScreen.copy(camera.position).addScaledVector(cur.sunDir, 1000).project(camera);
  const facing = camDir.dot(cur.sunDir);
  let vis = THREE.MathUtils.smoothstep(facing, 0.0, 0.35);
  const ex = Math.max(Math.abs(sunScreen.x), Math.abs(sunScreen.y));
  vis *= 1 - THREE.MathUtils.smoothstep(ex, 1.1, 1.9);
  godPass.uniforms.uSunPos.value.set(sunScreen.x*0.5 + 0.5, sunScreen.y*0.5 + 0.5);
  godPass.uniforms.uStrength.value = cur.god*vis*0.75;
  godPass.uniforms.uThreshold.value = 2.2;
  tmpC.copy(cur.sunColor); godPass.uniforms.uRayCol.value.copy(tmpC).multiplyScalar(1/Math.max(tmpC.r, tmpC.g, tmpC.b, 0.01));
  const gu = gradePass.uniforms;
  gu.uTime.value = time; gu.uFade.value = fade; gu.uLetterbox.value = letterbox; gu.uSat.value = cur.sat;
  gu.uLift.value.copy(cur.lift); gu.uGain.value.copy(cur.gain); gu.uVignette.value = cur.vignette;
  gu.uGrain.value = 0.03 + (cur.exposure - 1)*0.05;

  // life
  updateBirds(dt, time, cur.birds, cur.lightning > 0.5);
  const wHere = windAt(camera.position.x, camera.position.z);
  Sound.update(dt, wHere, camera.position.distanceTo(treeBase), cur);

  // UI timers
  if (titleTimer > 0){ titleTimer -= dt; if (titleTimer <= 0 && camMode === 'walk') titleEl.style.opacity = 0.0; }
  if (hintTimer > 0){ hintTimer -= dt; if (hintTimer <= 0) hint.style.opacity = 0; }
  if ((time*4 | 0) % 4 === 0) statsEl.textContent = `${perf.fps.toFixed(0)} fps · detail ${LEVELS[level].name}`;

  composer.render(dt);
  requestAnimationFrame(frame);
}

applyLevel(level);
setMood(0);
syncUI();
requestAnimationFrame(frame);
window.__meadow = { snapMood(i){ setMood(i); lerpState(cur, STATES[i], 1); }, setMood, enterWalk, enterCine, applyLevel, get level(){ return level; }, perf, camera };
</script>
</body>
