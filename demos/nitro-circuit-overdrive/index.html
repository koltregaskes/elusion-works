<!DOCTYPE html>
<html lang="en-GB" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nitro Circuit Overdrive | Elusion Works</title>
    <meta
      name="description"
      content="Launch Nitro Circuit Overdrive, a 2.5D top-down arcade racer."
    />
    <meta name="theme-color" content="#080d10" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <link rel="canonical" href="https://koltregaskes.github.io/nitro-circuit-overdrive/" />
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #080d10; color: #f4f0e6; }
      main { width: min(92vw, 880px); padding: 2rem; }
      img { width: 100%; height: auto; border-radius: 1rem; border: 1px solid #28343a; }
      p { max-width: 60ch; color: #b9c2c5; line-height: 1.6; }
      a { display: inline-block; margin-top: .75rem; padding: .8rem 1.1rem; border-radius: 999px; background: #d9ff57; color: #080d10; font-weight: 800; text-decoration: none; }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="thumbnail.webp" alt="Nitro Circuit Overdrive arcade racing game" width="1200" height="675" />
      <h1>Nitro Circuit Overdrive</h1>
      <p>
        A 2.5D top-down arcade racer with three cups, twelve tracks, Time Trial ghosts,
        Elimination, liveries and a photo mode.
      </p>
      <a href="https://koltregaskes.github.io/nitro-circuit-overdrive/" rel="noopener noreferrer">
        Launch the game
      </a>
    </main>
  </body>
</html>
