<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mirrie Dancers · aurora over Eshaness, Shetland</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;700&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#02040a;color:#dfe9e4;overflow:hidden;font-family:"Red Hat Mono",monospace}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:ew-resize;touch-action:none}
.hud{position:fixed;left:40px;top:34px;pointer-events:none}
h1{font:700 clamp(42px,6vw,88px)/.9 "Cormorant SC",serif;letter-spacing:.04em;color:#e9f3ee;text-shadow:0 0 30px rgba(120,255,190,.25)}
.sub{font:400 12px/1.7 "Red Hat Mono";letter-spacing:.14em;text-transform:uppercase;color:#93a9a0;margin-top:12px}
.panel{position:fixed;right:40px;top:38px;text-align:right;font:400 12px/1.9 "Red Hat Mono";letter-spacing:.1em;color:#93a9a0;pointer-events:none}
.panel b{color:#e9f3ee;font-weight:500}
.kp{position:fixed;left:40px;right:40px;bottom:34px;display:flex;align-items:center;gap:18px;font:500 11px "Red Hat Mono";letter-spacing:.14em;text-transform:uppercase;color:#93a9a0}
.track{flex:1;height:2px;background:linear-gradient(90deg,#2a4a3e,#5cf2a6 45%,#d65bbd 80%,#ff5a6a);position:relative;border-radius:2px}
.knob{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#e9f3ee;transform:translate(-50%,-50%);box-shadow:0 0 18px rgba(120,255,190,.8)}
.kv{font:700 30px "Cormorant SC";letter-spacing:.04em;color:#e9f3ee;min-width:110px;text-align:right}
.note{position:fixed;left:40px;bottom:72px;font:400 11px "Red Hat Mono";color:#6f857c;letter-spacing:.08em;pointer-events:none;max-width:52ch;line-height:1.6}
@media (max-width:700px){.hud{left:20px;top:22px}.panel{left:20px;right:auto;top:auto;bottom:118px;text-align:left;font-size:11px;line-height:1.7}.kp{left:20px;right:20px;bottom:24px;gap:10px}.kv{min-width:80px;font-size:24px}.note{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><h1>Mirrie<br>Dancers</h1><p class="sub">Aurora over Eshaness · Shetland · 60.5° N</p></div>
<div class="panel" id="panel">Local time <b id="clock">23:41</b><br>Bz <b id="bz">-6.2 nT</b><br>Solar wind <b id="sw">540 km/s</b><br>Sea state <b>slight</b></div>
<p class="note">Shetlanders call the aurora the mirrie dancers. Drag across the sky, or use the arrow keys, to change the geomagnetic activity. A shader drawn live; no images.</p>
<div class="kp"><span>Kp</span><div class="track" id="track"><div class="knob" id="knob"></div></div><span class="kv" id="kv">Kp 5</span></div>
<script>
const cv=document.getElementById('c');const gl=cv.getContext('webgl',{antialias:false,preserveDrawingBuffer:true});
const VS=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const FS=`precision highp float;uniform vec2 R;uniform float T;uniform float K;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}
vec3 aur(vec2 uv,float k){vec3 acc=vec3(0.);
 for(int i=0;i<3;i++){float fi=float(i);
  float base=.41+fi*.07-k*.015+.06*fbm(vec2(uv.x*1.3+T*.03+fi*4.,fi));
  float wave=.08*sin(uv.x*3.1+T*.25+fi*2.)+.05*fbm(vec2(uv.x*2.+T*.08,fi*3.));
  float y=uv.y-(base+wave);
  float rays=pow(fbm(vec2(uv.x*38.+fi*10.,T*.35+uv.x*2.)),2.2);
  float curtain=smoothstep(0.,.015,y)*exp(-y*(9.-k*.8))*(.55+1.6*rays);
  float edge=exp(-abs(y)*90.)*.6;
  vec3 g=vec3(.25,1.,.6);vec3 top=mix(vec3(.85,.3,.75),vec3(1.,.25,.3),clamp(k-6.,0.,3.)/3.);
  vec3 col=mix(g,top,smoothstep(.05,.35-k*.015,y)*(.25+k*.09));
  float diffuse=(1.-step(0.,y))*exp(y*14.)*.35;
  acc+=col*(curtain+edge+diffuse)*(.42+k*.07)*(1.-fi*.25);}
 return acc;}
void main(){vec2 uv=gl_FragCoord.xy/R;vec2 q=vec2(uv.x*R.x/R.y,uv.y);float k=K;
 float horizon=.3;
 vec3 sky=mix(vec3(.01,.02,.05),vec3(.02,.05,.08),smoothstep(.9,horizon,uv.y));
 vec2 sp=floor(q*vec2(420.));float st=step(.9975,h(sp))*smoothstep(horizon,.45,uv.y);st*=.5+.5*sin(T*3.+h(sp)*40.);
 sky+=vec3(st);
 vec3 col=sky;
 if(uv.y>horizon){col+=aur(q,k);}
 else{float d=horizon-uv.y;vec2 rq=vec2(q.x+.006*sin(q.y*70.+T*1.1)*(1.+d*6.)+.015*fbm(vec2(q.x*5.,q.y*40.-T*.5)),horizon+d*1.1);
  vec3 refl=aur(rq,k)*.42+mix(vec3(.01,.02,.05),vec3(.02,.05,.08),.6);
  float glint=pow(fbm(vec2(q.x*40.,q.y*260.-T*.9)),5.)*1.6;
  col=refl*(1.-d*2.2)+vec3(.15,.5,.35)*glint*(.2+k*.05)*smoothstep(.0,.25,horizon-d);}
 // cliffs silhouette (Eshaness-like headland) on the left, croft on the right
 float cliff=horizon+.11*smoothstep(.55,.0,q.x)+.03*fbm(vec2(q.x*9.,1.))-.02;
 float cl=step(uv.y,cliff)*step(horizon-.002,uv.y)*step(q.x,.62);
 float stack=step(abs(q.x-.72+.004*sin(uv.y*50.)),.009+.004*fbm(vec2(uv.y*30.,2.)))*step(uv.y,horizon+.085-.02*step(.718,q.x))*step(horizon-.002,uv.y);
 float land=horizon+.025+.015*fbm(vec2(q.x*5.,3.));float rl=step(uv.y,land)*step(horizon-.002,uv.y)*step(R.x/R.y-.42,q.x);
 vec2 hp=vec2(R.x/R.y-.22,land+.012);float house=step(abs(q.x-hp.x),.035)*step(abs(uv.y-hp.y),.013);float roof=step(uv.y,hp.y+.013+(.035-abs(q.x-hp.x))*.55)*step(hp.y+.012,uv.y)*step(abs(q.x-hp.x),.035);
 float win=step(abs(q.x-hp.x-.013),.006)*step(abs(uv.y-hp.y+.001),.005);
 float sil=max(max(cl,stack),max(rl,max(house,roof)));
 col=mix(col,vec3(.006,.01,.012),sil);
 col+=vec3(1.,.72,.35)*win*1.2;col+=vec3(1.,.6,.3)*.12*exp(-length((q-hp-vec2(.013,0.))*vec2(1.,1.))*40.);
 col=vec3(1.)-exp(-col*1.35);col=pow(col,vec3(.95));col*=1.-.35*pow(length(uv-.5)*1.2,2.);
 gl_FragColor=vec4(col,1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const uR=gl.getUniformLocation(pr,'R'),uT=gl.getUniformLocation(pr,'T'),uK=gl.getUniformLocation(pr,'K');
let K=5,Kt=5;const scale=Math.min(1,1.25/(devicePixelRatio||1));
function size(){cv.width=innerWidth*(devicePixelRatio||1)*scale;cv.height=innerHeight*(devicePixelRatio||1)*scale;gl.viewport(0,0,cv.width,cv.height)}size();addEventListener('resize',size);
const kv=document.getElementById('kv'),knob=document.getElementById('knob');
const WORDS=['quiet','quiet','unsettled','active','minor storm','moderate storm','strong storm','severe storm','extreme storm','extreme storm'];
function setK(v){Kt=Math.max(0,Math.min(9,v));}
function ui(){knob.style.left=(K/9*100)+'%';kv.textContent='Kp '+K.toFixed(0);document.getElementById('bz').textContent=(-1.2*K-.2).toFixed(1)+' nT';document.getElementById('sw').textContent=Math.round(380+K*34)+' km/s';kv.title=WORDS[Math.round(K)]}
let drag=false,sx=0,sk=0;cv.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sk=Kt});addEventListener('pointermove',e=>{if(drag)setK(sk+(e.clientX-sx)/innerWidth*12)});addEventListener('pointerup',()=>drag=false);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')setK(Kt+1);if(e.key==='ArrowLeft')setK(Kt-1)});
const t0=performance.now();function loop(){const t=(performance.now()-t0)/1000;K+=(Kt-K)*.05;gl.uniform2f(uR,cv.width,cv.height);gl.uniform1f(uT,t+20.);gl.uniform1f(uK,K);gl.drawArrays(gl.TRIANGLES,0,3);ui();requestAnimationFrame(loop)}loop();

</script>
</body>
</html>
