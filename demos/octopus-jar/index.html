<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   Constants
   ============================================================ */
const TAU = Math.PI * 2;
const NECK_TOP = 2.97;            // top of the jar's glass neck
const LID_Y0 = NECK_TOP;          // lid plate underside when fully screwed on
const PITCH = 0.1;                // lid rise per full turn (thread pitch)
const TURNS_FREE = 2.0;           // turns until the lid clears the thread
const N_ARMS = 8, N_J = 14, ARM_LEN = 2.4, SEG = ARM_LEN / (N_J - 1);
const TABLE_X = 3.6, TABLE_Z = 2.2;
const LID_R = 0.9;
const LID_ARMS = [0, 1, 3, 4, 6];
const BRACE_ARMS = [2, 5, 7];
const PHASES = ['settle', 'unscrew', 'pushoff', 'climb', 'slide', 'fall'];
const GRIP_K = 0.62;              // rad/s of lid spin per fully squeezed, holding arm
const HOLD_EPS = 0.1;             // tip must be within this of the contact to transmit torque
const DT = 1 / 60;

let seed = 20261110;
function rnd() { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = t => t * t * (3 - 2 * t);
function innerR(y) {
  if (y < 2.3) return 0.98;
  if (y > 2.6) return 0.76;
  return 0.98 + (0.76 - 0.98) * smooth((y - 2.3) / 0.3);
}
const outerR = y => innerR(y) + 0.06;
// world angle that increases with +Y rotation (CCW seen from above)
const worldAngle = p => Math.atan2(-p.z, p.x);
function moveTowards(v, goal, maxStep) {
  const dx = goal.x - v.x, dy = goal.y - v.y, dz = goal.z - v.z;
  const d = Math.hypot(dx, dy, dz);
  if (d <= maxStep || d < 1e-9) v.copy(goal); else { const s = maxStep / d; v.x += dx * s; v.y += dy * s; v.z += dz * s; }
}

/* ============================================================
   Renderer, camera, light
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060403);
scene.fog = new THREE.Fog(0x060403, 10, 22);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 60);
camera.position.set(0.9, 3.9, 9.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.5, 1.55, 0);
controls.enableDamping = true;
controls.maxPolarAngle = 1.52;
controls.minDistance = 3; controls.maxDistance = 15;

// the one warm side light
const lamp = new THREE.SpotLight(0xffa25a, 150, 26, 0.6, 0.7, 1.7);
lamp.position.set(-6.4, 4.8, 2.6);
lamp.target.position.set(0.4, 0.9, 0);
lamp.castShadow = true;
lamp.shadow.mapSize.set(1024, 1024);
lamp.shadow.bias = -0.0005;
lamp.shadow.normalBias = 0.025;
lamp.shadow.camera.near = 2; lamp.shadow.camera.far = 20;
scene.add(lamp, lamp.target);
scene.add(new THREE.HemisphereLight(0x1c2230, 0x0a0604, 0.55)); // faint room bounce, not a source

/* ============================================================
   Procedural textures (all drawn in code)
   ============================================================ */
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
const woodTex = canvasTex(1024, 512, (g, w, h) => {
  const img = g.createImageData(w, h), d = img.data;
  for (let y = 0; y < h; y++) {
    const plank = Math.floor(y / 128), py = y % 128;
    for (let x = 0; x < w; x++) {
      const warp = Math.sin(x * 0.004 + plank * 2.1 + Math.sin(y * 0.03) * 1.2) * 9 + Math.sin(x * 0.017 + y * 0.004) * 2.5;
      const ring = 0.5 + 0.5 * Math.sin((py + warp) * 0.42 + Math.sin(x * 0.0023 + plank) * 5);
      const n = ((Math.sin(x * 12.9898 + y * 78.233) * 43758.5453) % 1 + 1) % 1;
      let k = Math.pow(ring, 1.6) * 0.32 + n * 0.1 + 0.3;
      if (py < 2 || py > 125) k *= 0.35; // plank seams
      const i = (y * w + x) * 4;
      d[i] = 42 + k * 78; d[i + 1] = 27 + k * 50; d[i + 2] = 16 + k * 28; d[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
});
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;

const wallTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#2a2420'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 4000; i++) {
    g.fillStyle = `rgba(${rnd() < .5 ? '0,0,0' : '90,80,70'},${rnd() * 0.08})`;
    g.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 10, 2 + rnd() * 10);
  }
});
wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping; wallTex.repeat.set(4, 2);

const skinTex = canvasTex(512, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#9c3a20'); gr.addColorStop(1, '#c4583a');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1400; i++) {
    const r = 1 + rnd() * 5;
    g.fillStyle = rnd() < 0.55 ? `rgba(70,16,8,${0.12 + rnd() * 0.3})` : `rgba(235,140,95,${0.1 + rnd() * 0.25})`;
    g.beginPath(); g.arc(rnd() * w, rnd() * h, r, 0, TAU); g.fill();
  }
});
const armTex = canvasTex(1024, 128, (g, w, h) => {
  g.fillStyle = '#a8402a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 700; i++) {
    g.fillStyle = rnd() < 0.5 ? `rgba(70,16,8,${0.1 + rnd() * 0.3})` : `rgba(235,140,95,${0.08 + rnd() * 0.2})`;
    g.beginPath(); g.arc(rnd() * w, rnd() * 56, 1 + rnd() * 3, 0, TAU); g.fill();
  }
  g.fillStyle = 'rgba(245,175,145,0.55)'; g.fillRect(0, 62, w, 66); // pale underside
  const n = 30;
  for (let i = 0; i < n; i++) for (let row = 0; row < 2; row++) {
    const x = (i + 0.5 + row * 0.5) / n * w, s = 1 - (x / w) * 0.8;
    const y = row ? 108 : 82, r = 10 * s + 1.5;
    g.fillStyle = '#f1c2aa'; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    g.fillStyle = '#b8705a'; g.beginPath(); g.arc(x, y, r * 0.45, 0, TAU); g.fill();
  }
});
const lidTopTex = canvasTex(512, 512, (g, w, h) => {
  const c = w / 2;
  const gr = g.createRadialGradient(c * 0.8, c * 0.7, 10, c, c, c);
  gr.addColorStop(0, '#e9cf8e'); gr.addColorStop(1, '#8c6c33');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(60,40,15,.55)';
  for (const r of [240, 228, 150, 140]) { g.lineWidth = 3; g.beginPath(); g.arc(c, c, r, 0, TAU); g.stroke(); }
  g.fillStyle = '#3d2a10'; g.font = 'bold 26px Georgia, serif'; g.textAlign = 'center';
  const txt = 'OCTOPUS PRESERVES · KEEP SEALED · ';
  for (let i = 0; i < txt.length; i++) {
    const a = i / txt.length * TAU;
    g.save(); g.translate(c + Math.sin(a) * 186, c - Math.cos(a) * 186); g.rotate(a); g.fillText(txt[i], 0, 9); g.restore();
  }
  g.fillStyle = '#8e1f16'; g.beginPath(); g.moveTo(c - 18, c - 118); g.lineTo(c + 18, c - 118); g.lineTo(c, c - 70); g.fill();
  g.font = 'italic 34px Georgia, serif'; g.fillStyle = '#4a3312'; g.fillText('No. 8', c, c + 14);
});
const shadowDecal = canvasTex(256, 256, (g, w, h) => {
  const gr = g.createRadialGradient(w / 2, h / 2, 40, w / 2, h / 2, w / 2);
  gr.addColorStop(0, 'rgba(0,0,0,0.55)'); gr.addColorStop(0.75, 'rgba(0,0,0,0.25)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
}, false);

/* environment map for glass/metal reflections: a dark room with one warm window, built in code */
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.BoxGeometry(20, 10, 20), new THREE.MeshBasicMaterial({ color: 0x0a0705, side: THREE.BackSide })));
const envPanel = new THREE.Mesh(new THREE.PlaneGeometry(3, 4.5), new THREE.MeshBasicMaterial({ color: new THREE.Color(1, 0.6, 0.28).multiplyScalar(7) }));
envPanel.position.set(-9.8, 2.5, 2.5); envPanel.rotation.y = Math.PI / 2; envScene.add(envPanel);
const envStrip = new THREE.Mesh(new THREE.PlaneGeometry(14, 0.6), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.5, 0.35, 0.22) }));
envStrip.position.set(0, -4.9, 0); envStrip.rotation.x = -Math.PI / 2; envScene.add(envStrip);
const envTex = pmrem.fromScene(envScene, 0.02).texture;

/* ============================================================
   Room, table
   ============================================================ */
const woodMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.62, metalness: 0 });
const table = new THREE.Mesh(new THREE.BoxGeometry(TABLE_X * 2, 0.24, TABLE_Z * 2), woodMat);
table.position.y = -0.12; table.receiveShadow = true; table.castShadow = true; scene.add(table);
woodTex.repeat.set(1.4, 1);
const legMat = new THREE.MeshStandardMaterial({ color: 0x2c1a0e, roughness: 0.7 });
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.22, 3.2, 0.22), legMat);
  leg.position.set(sx * (TABLE_X - 0.3), -1.84, sz * (TABLE_Z - 0.3)); leg.castShadow = true; scene.add(leg);
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x1a120c, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -3.44; floor.receiveShadow = true; scene.add(floor);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 14), new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.95 }));
wall.position.set(0, 2.5, -4.6); wall.receiveShadow = true; scene.add(wall);

/* ============================================================
   Glass jar
   ============================================================ */
const profile = [];
profile.push(new THREE.Vector2(0.001, 0), new THREE.Vector2(0.96, 0), new THREE.Vector2(1.03, 0.03), new THREE.Vector2(1.04, 0.1));
for (let i = 0; i <= 10; i++) { const y = 0.1 + i / 10 * 2.2; profile.push(new THREE.Vector2(outerR(y), y)); }
for (let i = 1; i <= 8; i++) { const y = 2.3 + i / 8 * 0.3; profile.push(new THREE.Vector2(outerR(y), y)); }
profile.push(new THREE.Vector2(0.82, NECK_TOP - 0.01), new THREE.Vector2(0.80, NECK_TOP), new THREE.Vector2(0.77, NECK_TOP - 0.01));
for (let i = 0; i <= 8; i++) { const y = 2.6 - i / 8 * 0.3; profile.push(new THREE.Vector2(innerR(y), y)); }
profile.push(new THREE.Vector2(innerR(0.2), 0.18), new THREE.Vector2(0.9, 0.1), new THREE.Vector2(0.001, 0.1));
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xd8efe6, roughness: 0.05, metalness: 0, transparent: true, opacity: 0.1,
  envMap: envTex, envMapIntensity: 2.4, side: THREE.DoubleSide, depthWrite: false,
  clearcoat: 1, clearcoatRoughness: 0.04,
});
glassMat.onBeforeCompile = sh => {
  sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>', `
    float fr = pow(1.0 - abs(dot(normalize(normal), normalize(vViewPosition))), 2.4);
    diffuseColor.a = clamp(diffuseColor.a + fr * 0.6, 0.0, 0.85);
    #include <opaque_fragment>`);
};
const jar = new THREE.Mesh(new THREE.LatheGeometry(profile, 72), glassMat);
jar.renderOrder = 2; scene.add(jar);
class Helix extends THREE.Curve {
  getPoint(t, out = new THREE.Vector3()) {
    const a = t * TAU * 2.15, r = 0.835;
    return out.set(r * Math.cos(a), 2.73 + t * 0.2, -r * Math.sin(a));
  }
}
const threadMat = glassMat.clone(); threadMat.opacity = 0.28; threadMat.onBeforeCompile = glassMat.onBeforeCompile;
const jarThread = new THREE.Mesh(new THREE.TubeGeometry(new Helix(), 180, 0.016, 6), threadMat);
jarThread.renderOrder = 2; scene.add(jarThread);
const jarShadow = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 2.8), new THREE.MeshBasicMaterial({ map: shadowDecal, transparent: true, depthWrite: false, opacity: 0.6 }));
jarShadow.rotation.x = -Math.PI / 2; jarShadow.position.set(0.25, 0.003, -0.05); scene.add(jarShadow);

/* ============================================================
   Lid: outer group (position + tumble), inner spin group (screw angle)
   ============================================================ */
const metalMat = new THREE.MeshStandardMaterial({ color: 0xc9a45c, metalness: 0.85, roughness: 0.33, envMap: envTex, envMapIntensity: 1.3 });
const lidTopMat = new THREE.MeshStandardMaterial({ map: lidTopTex, metalness: 0.6, roughness: 0.38, envMap: envTex, envMapIntensity: 1.0 });
const lidOuter = new THREE.Group(), lidSpin = new THREE.Group();
lidOuter.add(lidSpin); scene.add(lidOuter);
{
  const plate = new THREE.Mesh(new THREE.CylinderGeometry(LID_R, LID_R, 0.05, 96), [metalMat, lidTopMat, metalMat]);
  plate.position.y = 0.025;
  const skirtGeo = new THREE.CylinderGeometry(LID_R, LID_R, 0.22, 96, 1, true);
  const p = skirtGeo.attributes.position;
  for (let i = 0; i < p.count; i++) { // knurled grip ridges
    const x = p.getX(i), z = p.getZ(i), a = Math.atan2(z, x), k = 1 + 0.014 * Math.sign(Math.sin(a * 60));
    p.setX(i, x * k); p.setZ(i, z * k);
  }
  skirtGeo.computeVertexNormals();
  const skirt = new THREE.Mesh(skirtGeo, new THREE.MeshStandardMaterial({ color: 0xc9a45c, metalness: 0.85, roughness: 0.33, envMap: envTex, envMapIntensity: 1.3, side: THREE.DoubleSide }));
  skirt.position.y = -0.085;
  const bead = new THREE.Mesh(new THREE.TorusGeometry(LID_R, 0.018, 6, 96), metalMat);
  bead.rotation.x = Math.PI / 2; bead.position.y = -0.195;
  const bevel = new THREE.Mesh(new THREE.TorusGeometry(LID_R - 0.01, 0.022, 6, 96), metalMat);
  bevel.rotation.x = Math.PI / 2; bevel.position.y = 0.05;
  for (const m of [plate, skirt, bead, bevel]) { m.castShadow = true; m.receiveShadow = true; lidSpin.add(m); }
}

/* ============================================================
   Octopus body
   ============================================================ */
const skinMat = new THREE.MeshStandardMaterial({ map: skinTex, roughness: 0.42, metalness: 0 });
const body = new THREE.Group(); scene.add(body);
const mantleGeo = new THREE.SphereGeometry(1, 36, 24);
{
  const p = mantleGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    p.setZ(i, z - 0.18 * Math.max(0, y) * Math.max(0, y) + 0.03 * Math.sin(x * 9) * Math.sin(y * 7));
  }
  mantleGeo.computeVertexNormals();
}
const mantle = new THREE.Mesh(mantleGeo, skinMat);
mantle.position.set(0, 0.55, -0.06); mantle.castShadow = true; body.add(mantle);
const MANTLE_LOCAL = new THREE.Vector3(0, 0.55, -0.06);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.29, 28, 18), skinMat);
head.scale.set(1.08, 0.78, 1); head.position.set(0, 0.13, 0.02); head.castShadow = true; body.add(head);
const eyes = [];
for (const sx of [-1, 1]) {
  const eg = new THREE.Group(); eg.position.set(sx * 0.2, 0.3, 0.29);
  const sclera = new THREE.Mesh(new THREE.SphereGeometry(0.1, 18, 12), new THREE.MeshStandardMaterial({ color: 0xe6d49a, roughness: 0.18 }));
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.06, 14, 10), new THREE.MeshStandardMaterial({ color: 0x050302, roughness: 0.1 }));
  pupil.scale.set(1.1, 0.34, 0.5); pupil.position.z = 0.072;
  const brow = new THREE.Mesh(new THREE.SphereGeometry(0.115, 16, 10, 0, TAU, 0, Math.PI * 0.42), skinMat);
  brow.rotation.x = -0.35;
  eg.add(sclera, pupil); body.add(eg); body.add(brow); brow.position.copy(eg.position);
  eyes.push(eg);
}

/* ============================================================
   Arms: FABRIK chains with collisions, skinned into tapered tubes
   ============================================================ */
const RINGS = 2 * (N_J - 1) + 1, RAD = 10, VPR = RAD + 1;
const armMat = new THREE.MeshStandardMaterial({ map: armTex, roughness: 0.45, metalness: 0 });
const markerGeo = new THREE.SphereGeometry(0.06, 10, 8);
const COL = { grip: 0x44ff66, reach: 0xffc040, release: 0xff5040, free: 0x888888, brace: 0x4aa0ff, plant: 0x4aa0ff, step: 0xb080ff, air: 0x888888 };
const _v = new THREE.Vector3(), _w = new THREE.Vector3(), _u = new THREE.Vector3(), _q = new THREE.Quaternion();
const ctx = { lidAttached: true, lidUnderY: LID_Y0, mantleC: new THREE.Vector3(), mantleR: 0.47, bodyUp: new THREE.Vector3(0, 1, 0) };

function collide(J, k) {
  const o = k * 3;
  let x = J[o], y = J[o + 1], z = J[o + 2];
  let r = Math.hypot(x, z);
  // glass shell (wall, shoulder, neck): keep joints off the glass on whichever side they are
  if (y < NECK_TOP + 0.02 && y > -0.05) {
    const ri = innerR(y), ro = ri + 0.06, m = 0.05;
    if (r > ri - m && r < ro + m) {
      const nr = r < (ri + ro) * 0.5 ? ri - m : ro + m, s = nr / Math.max(r, 1e-6);
      x *= s; z *= s; r = nr;
    }
    if (r < ri && y < 0.15) y = 0.15; // jar floor

    if (!L.launched) {
      L.pos.y += 0.55 * dt; // arms shove the freed lid upward
      for (const i of LID_ARMS) { const a = arms[i]; a.mode = 'grip'; a.sqz = 1; lidPoint(a.alpha, a.cr, a.goal); a.tgt.copy(a.goal); }
      if (S.phaseTime > 0.45) {
        L.launched = true; L.v.set(-2.6, 2.0, 0.3); L.w = 4.2;
        for (const i of LID_ARMS) { const a = arms[i]; a.mode = 'release'; a.held = false; a.sqz = 0; a.timer = 0.4; S.checks.releases++; }
      }
    } else {
      for (const i of LID_ARMS) {
        const a = arms[i], r = 0.5;
        a.goal.set(r * Math.cos(a.a), 2.7, -r * Math.sin(a.a));
        moveTowards(a.tgt, a.goal, 2.5 * dt);
        a.mode = 'free';
      }
    }
    for (const i of BRACE_ARMS) moveTowards(arms[i].tgt, arms[i].goal, 2 * dt);
    S.lookAt.copy(L.pos);
    if (S.phaseTime > 1.5) enter('climb');
  }

  else if (P === 'climb') {
    climbCurve.getTangentAt(S.climbS, _tan);
    const planted = walk(dt, _tan);
    const grip = clamp((planted - 1) / 3, 0, 1); // body only advances while enough arms are holding on
    S.climbS = Math.min(1, S.climbS + dt * 0.62 / CLIMB_LEN * grip);
    climbCurve.getPointAt(S.climbS, S.hub);
    S.mantleDir.set(0, 0.85, 0).addScaledVector(_tan, -0.6).normalize();
    S.lookAt.copy(S.hub).addScaledVector(_tan, 2).add(_v.set(0, 0, 1.5));
    if (S.climbS >= 1) enter('slide');
  }

  else if (P === 'slide') {
    _tan.set(1, 0, 0);
    const planted = walk(dt, _tan);
    const grip = clamp((planted - 1) / 3, 0, 1);
    S.hub.x += 0.7 * grip * dt;
    S.hub.y += (0.36 - S.hub.y) * (1 - Math.exp(-4 * dt));
    S.hub.z += (0.25 - S.hub.z) * (1 - Math.exp(-2 * dt));
    S.mantleDir.set(-0.45, 1, 0).normalize();
    S.lookAt.set(TABLE_X + 1, -0.5, 0.6);
    if (S.hub.x >= 3.2) enter('fall');
  }

  else if (P === 'fall') {
    const V = S.fallV;
    if (S.hub.x < TABLE_X + 0.15) { // slipping over the edge
      V.x += 1.4 * dt;
      S.hub.x += V.x * dt;
      S.hub.y = 0.36 - Math.max(0, S.hub.x - (TABLE_X - 0.2)) * 0.9;
      S.spin += Math.max(0, S.hub.x - (TABLE_X - 0.3)) * 2.2 * dt;
    } else {
      V.y -= 9.8 * dt; S.hub.addScaledVector(V, dt); S.spin += 2.6 * dt;
    }
    S.mantleDir.set(-0.5, 1, 0).normalize();
    for (const a of arms) {
      if (a.mode === 'plant') {
        a.tgt.copy(a.anchor);
        if (a.tip(_tip).distanceTo(a.anchor) > 0.35 || S.hub.y < -0.6) a.mode = 'air';
      } else {
        a.goal.copy(S.hub).addScaledVector(a.dir, 0.8).add(_v.set(-0.2, 0.9, 0)).addScaledVector(V, -0.12);
        moveTowards(a.tgt, a.goal, 7 * dt);
        a.mode = 'air';
      }
    }
    S.lookAt.set(TABLE_X + 0.5, -2, 1);
    if (S.hub.y < -3.0) enter('reset');
  }

  else if (P === 'reset') {
    for (const a of arms) moveTowards(a.tgt, a.goal, 4 * dt);
    S.hub.addScaledVector(S.fallV, dt); S.fallV.y -= 9.8 * dt;
  }
}

/* ---- lid as a loose rigid body once it leaves the thread ---- */
function stepLidBody(dt) {
  const L = S.lid;
  if (!L.free || !L.launched) return;
  if (!L.settled) {
    L.v.y -= 9.8 * dt;
    L.pos.addScaledVector(L.v, dt);
    L.tilt += L.w * dt;
  } else {
    L.v.multiplyScalar(Math.exp(-6 * dt)); L.pos.addScaledVector(L.v, dt);
    const target = Math.round(L.tilt / Math.PI) * Math.PI;
    L.tilt += (target - L.tilt) * (1 - Math.exp(-6 * dt));
  }
  const s = Math.abs(Math.sin(L.tilt)), c = Math.cos(L.tilt);
  const low = L.pos.y - LID_R * s + Math.min(-0.2 * c, 0.05 * c);
  // keep clear of the jar while falling past it
  const rr = Math.hypot(L.pos.x, L.pos.z);
  if (low < NECK_TOP + 0.02 && rr < 1.98) {
    const k = 1.98 / Math.max(rr, 1e-6); L.pos.x *= k; L.pos.z *= k;
    const vr = (L.v.x * L.pos.x + L.v.z * L.pos.z) / 1.98;
    if (vr < 0) { L.v.x -= vr * L.pos.x / 1.98; L.v.z -= vr * L.pos.z / 1.98; }
  }
  if (low < 0 && Math.abs(L.pos.x) < TABLE_X) {
    L.pos.y -= low;
    if (!L.settled && L.v.y < 0) {
      L.v.y = -L.v.y * 0.32; L.v.x *= 0.55; L.v.z *= 0.55; L.w *= 0.45; L.bounces++;
      if (L.bounces >= 2 || Math.abs(L.v.y) < 0.6) { L.settled = true; L.v.y = 0; L.w = 0; }
    }
  }
  L.pos.x = Math.max(L.pos.x, -TABLE_X + 0.95);
}

/* ---- one fixed simulation tick ---- */
function tick(dt) {
  S.time += dt; S.phaseTime += dt;
  stepPhase(dt);
  syncBody(dt, S.phase === 'fall' ? 12 : 5);

  // arms: organic wiggle, then solve towards targets under collisions
  for (const a of arms) {
    a.wiggle(S.time, a.mode === 'grip' ? 0.0015 : a.mode === 'plant' || a.mode === 'brace' ? 0.003 : 0.006);
    a.solve(3);
  }

  // lid mechanics: torque only comes from arms that are gripping AND actually holding the contact point
  const thetaBefore = S.theta;
  let drive = 0, holding = 0;
  if (S.phase === 'unscrew') {
    for (const i of LID_ARMS) {
      const a = arms[i];
      if (a.mode === 'grip') {
        a.slip = a.tip(_tip).distanceTo(a.goal);
        a.held = a.slip < HOLD_EPS;
        if (a.sqz >= 1) S.checks.maxGripSlip = Math.max(S.checks.maxGripSlip, a.slip);
        if (a.held) { drive += a.sqz; holding++; }
      } else a.held = false;
    }
    S.omega = GRIP_K * drive;           // friction-dominated: no grip, no spin, no coasting
    S.theta += S.omega * dt;
    if (S.theta - thetaBefore > 1e-9 && holding === 0) S.checks.turnWithoutGrip++;
    if (S.theta >= TURNS_FREE * TAU) { S.theta = TURNS_FREE * TAU; syncLid(); enter('pushoff'); }
  } else {
    S.omega = 0;
    for (const a of arms) if (S.phase !== 'pushoff' || !LID_ARMS.includes(a.i)) a.held = false;
    if (S.phase === 'pushoff' && !S.lid.launched) for (const i of LID_ARMS) arms[i].held = true;
  }
  stepLidBody(dt);
  syncLid();
  if (!S.lid.free) {
    const err = Math.abs((lidOuter.position.y - LID_Y0) - PITCH * S.theta / TAU);
    S.checks.maxThreadError = Math.max(S.checks.maxThreadError, err);
  }

  // fade/loop
  if (S.fadeDir) {
    S.fade = clamp(S.fade + S.fadeDir * dt * 2.4, 0, 1);
    if (S.fadeDir > 0 && S.fade >= 1) { S.cycles++; const f = 1; jump('settle'); S.fade = f; S.fadeDir = -1; }
    else if (S.fadeDir < 0 && S.fade <= 0) S.fadeDir = 0;
  }
}

function publish() {
  pub.phase = S.phase; pub.phaseTime = +S.phaseTime.toFixed(3);
  pub.lidAngle = S.theta; pub.lidAngleDeg = S.theta * 180 / Math.PI; pub.lidTurns = S.theta / TAU;
  pub.lidRise = S.lid.free ? null : lidOuter.position.y - LID_Y0;
  pub.lidOmega = S.omega; pub.lidFree = S.lid.free;
  pub.grip = arms.map(a => a.mode === 'grip' ? (a.held ? 'grip' : 'grip-slipping') : a.mode);
  pub.gripping = arms.map(a => a.mode === 'grip' && a.held);
  pub.gripCount = pub.gripping.filter(Boolean).length;
  pub.anyGrip = pub.gripCount > 0;
  pub.loops = S.cycles;
}

/* ============================================================
   Dust in the light beam (cheap atmosphere)
   ============================================================ */
const dustN = 220, dustPos = new Float32Array(dustN * 3);
for (let i = 0; i < dustN; i++) { dustPos[i * 3] = -4 + rnd() * 7; dustPos[i * 3 + 1] = rnd() * 5; dustPos[i * 3 + 2] = -2 + rnd() * 4; }
const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xffc58a, size: 0.025, transparent: true, opacity: 0.45, depthWrite: false, blending: THREE.AdditiveBlending }));
scene.add(dust);

/* ============================================================
   Inspector HUD + window API
   ============================================================ */
const $ = id => document.getElementById(id);
const hud = $('hud'), fadeEl = $('fade');
const gripsEl = $('grips');
const gripSpans = arms.map((a, i) => { const s = document.createElement('span'); s.title = 'arm ' + i; gripsEl.appendChild(s); return s; });
const phaseBtns = PHASES.map((p, i) => {
  const b = document.createElement('button'); b.textContent = (i + 1) + ' ' + p; b.onclick = () => jump(p); $('phaseBtns').appendChild(b); return b;
});
function setPaused(v) { S.paused = v; $('b-pause').textContent = v ? 'play' : 'pause'; $('b-pause').classList.toggle('on', v); }
function setSpeed(v) { S.speed = v; $('b-speed').textContent = v + 'x'; }
function setMarkers(v) { S.markers = v; arms.forEach(a => a.marker.visible = v); $('b-mark').classList.toggle('on', v); }
$('b-pause').onclick = () => setPaused(!S.paused);
$('b-step').onclick = () => { setPaused(true); tick(DT); publish(); };
$('b-speed').onclick = () => setSpeed(S.speed === 1 ? 2 : S.speed === 2 ? 4 : S.speed === 4 ? 0.25 : 1);
$('b-mark').onclick = () => setMarkers(!S.markers);
addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '6') jump(PHASES[+e.key - 1]);
  else if (e.key === ' ') { setPaused(!S.paused); e.preventDefault(); }
  else if (e.key === '.') { setPaused(true); tick(DT); publish(); }
  else if (e.key === 'm') setMarkers(!S.markers);
  else if (e.key === 'h') hud.classList.toggle('hidden');
});
const SHORT = { grip: 'G', 'grip-slipping': 'g', reach: 'R', release: 'L', free: '-', brace: 'B', plant: 'P', step: 'S', air: 'A' };
function renderHud() {
  $('h-phase').textContent = `${pub.phase}  ${pub.phaseTime.toFixed(1)}s`;
  $('h-angle').textContent = `${pub.lidAngleDeg.toFixed(1)}°  (${pub.lidTurns.toFixed(2)} / ${TURNS_FREE} turns)`;
  $('h-rise').textContent = pub.lidFree ? 'off the thread' : `${(pub.lidRise * 1000 / 10).toFixed(2)} cm-units  (${pub.lidRise.toFixed(4)})`;
  $('h-omega').textContent = pub.lidOmega.toFixed(2) + ' rad/s';
  $('h-gc').textContent = pub.gripCount + (pub.lidOmega > 0 ? '  turning' : '  still');
  pub.grip.forEach((g, i) => { const s = gripSpans[i]; s.textContent = SHORT[g] ?? g; s.className = g === 'grip-slipping' ? 'reach' : g; });
  const c = S.checks;
  $('h-v1').innerHTML = `<span class="${c.turnWithoutGrip ? 'bad' : 'ok'}">${c.turnWithoutGrip}</span>`;
  $('h-v2').innerHTML = `<span class="${c.maxThreadError > 1e-6 ? 'bad' : 'ok'}">${c.maxThreadError.toExponential(1)}</span>`;
  $('h-v3').innerHTML = `<span class="${c.maxGripSlip > HOLD_EPS ? 'bad' : 'ok'}">${c.maxGripSlip.toFixed(3)}</span>`;
  $('h-v4').textContent = `${c.grabs} / ${c.releases}`;
  $('h-fps').textContent = `${pub.loops} / ${pub.fps}`;
  phaseBtns.forEach((b, i) => b.classList.toggle('on', PHASES[i] === pub.phase));
}

window.octo = {
  get state() { return pub; },
  phases: PHASES.slice(),
  jump, pause: () => setPaused(true), resume: () => setPaused(false),
  step(n = 1) { for (let i = 0; i < n; i++) tick(DT); publish(); return pub; },
  // run the simulation headlessly for `seconds` (no rendering) and return the state; handy for tests
  advance(seconds) { const n = Math.round(seconds / DT); for (let i = 0; i < n; i++) tick(DT); publish(); return pub; },
  setSpeed, setMarkers,
  constants: { PITCH, TURNS_FREE, NECK_TOP, GRIP_K, HOLD_EPS },
};

/* ============================================================
   Main loop: fixed 60 Hz simulation, render every frame
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const params = new URLSearchParams(location.search);
if (params.get('hud') === '0') hud.classList.add('hidden');
if (params.get('speed')) setSpeed(+params.get('speed') || 1);
if (params.get('markers') === '1') setMarkers(true);
jump(PHASES.includes(params.get('phase')) ? params.get('phase') : 'settle');
if (params.get('paused') === '1') setPaused(true);

let last = performance.now(), acc = 0, frames = 0, fpsT = 0, hudT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const real = Math.min(0.1, (now - last) / 1000); last = now;
  if (!S.paused) {
    acc += real * S.speed;
    let n = 0;
    while (acc >= DT && n < 8) { tick(DT); acc -= DT; n++; }
    if (n === 8) acc = 0;
  }
  for (const a of arms) a.updateMesh();
  // eyes track whatever the octopus cares about
  for (const e of eyes) e.lookAt(S.lookAt);
  // dust drift
  const dp = dustGeo.attributes.position.array;
  for (let i = 0; i < dustN; i++) { dp[i * 3 + 1] += 0.0016 * Math.sin(S.time * 0.3 + i); dp[i * 3] += 0.0009; if (dp[i * 3] > 3) dp[i * 3] = -4; }
  dustGeo.attributes.position.needsUpdate = true;
  fadeEl.style.opacity = S.fade;
  controls.update();
  renderer.render(scene, camera);
  publish();
  frames++; fpsT += real; hudT += real;
  if (fpsT >= 0.5) { pub.fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; }
  if (hudT >= 0.1 && !hud.classList.contains('hidden')) { hudT = 0; renderHud(); }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
