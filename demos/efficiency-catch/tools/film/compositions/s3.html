<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>3. The baseline</title>
    <script src="../assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Outfit"; src: url("../assets/fonts/outfit-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      @font-face { font-family: "JetBrains Mono"; src: url("../assets/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; font-display: block; }
      :root { --ground: #111315; --panel: #1a1d20; --ink: #f4f5f3; --muted: #9aa2a8; --green: #3fe08a; --green-ink: #06210f; --display: "Outfit", sans-serif; --mono: "JetBrains Mono", monospace; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      .clip { position: absolute; inset: 0; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; padding: 120px 140px 150px; background: var(--ground); color: var(--ink); font-family: var(--display); }
      .eyebrow { font: 600 30px/1 var(--mono); letter-spacing: 0.22em; text-transform: uppercase; color: var(--green); }
      .big { font-weight: 800; letter-spacing: -0.035em; line-height: 0.95; }
      .green { color: var(--green); }
      .muted { color: var(--muted); }
      .abs { position: absolute; }
      /* comic-book dots, used sparingly */
      .dots { position: absolute; background-image: radial-gradient(circle at 50% 50%, var(--green) 0 34%, transparent 36%); background-size: 26px 26px; opacity: 0.16; }
      /* 3 the baseline */
      #chart { left: 140px; top: 250px; width: 760px; height: 590px; }
      #axis { left: 0; right: 0; bottom: 0; height: 6px; background: var(--ink); }
      #bar { left: 150px; bottom: 6px; width: 220px; height: 480px; background: var(--ink); transform-origin: 50% 100%; }
      #barlabel1, #barlabel2 { left: 150px; width: 220px; text-align: center; font: 800 76px/1 var(--display); }
      #barlabel1 { bottom: 266px; } #barlabel2 { bottom: 506px; }
      #pace { left: 110px; bottom: -68px; width: 300px; text-align: center; font: 600 28px/1 var(--mono); letter-spacing: 0.16em; color: var(--muted); }
      #plusai { left: 388px; bottom: 120px; padding: 14px 26px; border-radius: 999px; background: var(--green); color: var(--green-ink); font: 800 44px/1 var(--display); }
      #expected { left: 60px; right: 0; bottom: 246px; height: 0; border-top: 6px dashed var(--green); }
      #expectedlabel { right: 0; bottom: 262px; font: 600 28px/1 var(--mono); letter-spacing: 0.2em; color: var(--green); }
      .lines i { position: absolute; left: 400px; width: 120px; height: 6px; background: var(--ink); border-radius: 3px; }
      #root .col { left: 1010px; right: 140px; }
      #s3a { top: 330px; font-size: 76px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.05; }
      #s3b { top: 520px; font-size: 76px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.05; }
      #s3c { top: 270px; font-size: 86px; }
      #s3d { top: 600px; font-size: 92px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s3" data-width="1920" data-height="1080" data-duration="12">

        <p class="eyebrow" id="s3e">The productivity paradox</p>
        <div id="chart" class="abs">
          <div id="bar" class="abs"></div>
          <div id="barlabel1" class="abs">1&times;</div>
          <div id="barlabel2" class="abs green">2&times;</div>
          <div class="lines" id="lines"><i style="bottom:140px"></i><i style="bottom:230px;width:170px"></i><i style="bottom:320px"></i></div>
          <div id="plusai" class="abs">+ AI</div>
          <div id="expected" class="abs"></div>
          <div id="expectedlabel" class="abs">Expected of you</div>
          <div id="axis" class="abs"></div>
          <div id="pace" class="abs">YOUR PACE</div>
        </div>
        <div id="s3a" class="abs col">You do complete tasks faster.</div>
        <div id="s3b" class="abs col">Then your manager <span class="green">notices.</span></div>
        <div id="s3c" class="abs col big">The efficiency gains don&rsquo;t free up your time.</div>
        <div id="s3d" class="abs col big green">They raise the baseline.</div>
      <script>
        (function () {
          // This scene runs from 14.4 s of the film. Times below are film times; at() turns them into this scene's own clock.
          const T0 = 14.4, at = t => Math.round((t - T0) * 1000) / 1000, tl = gsap.timeline({ paused: true });
          const fromTo = (sel, a, b, t) => tl.fromTo(sel, a, b, at(t)), to = (sel, v, t) => tl.to(sel, v, at(t));
          const up = (sel, t, y = 46, d = 0.5) => fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const slam = (sel, t, from = 1.7) => fromTo(sel, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, t);
          const pop = (sel, t) => fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(2.4)" }, t);
          const off = (sel, t, d = 0.3) => to(sel, { opacity: 0, duration: d, ease: "power2.in" }, t);
          up("#s3e", 14.4, 20);
          fromTo("#bar", { scaleY: 0 }, { scaleY: 0.5, duration: 0.6, ease: "power3.out" }, 14.5);
          up("#barlabel1", 15.0, 20, 0.3); up("#pace", 14.6, 10, 0.3);
          fromTo("#expected", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 15.6); fromTo("#expectedlabel", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 15.6);
     
          pop("#plusai", 16.8);
          to("#bar", { scaleY: 1, duration: 0.5, ease: "power4.out" }, 17.2); off("#barlabel1", 17.2, 0.15); slam("#barlabel2", 17.45, 1.5);
          fromTo("#lines", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.2 }, 17.2); off("#lines", 17.9, 0.4);
          up("#s3a", 17.5);
          up("#s3b", 19.4);
          to(["#expected", "#expectedlabel"], { y: -240, duration: 0.45, ease: "back.out(1.6)" }, 20.6);
     
          off("#s3a", 22.2); off("#s3b", 22.2);
          up("#s3c", 22.6); slam("#s3d", 24.0, 1.3);
          tl.set({}, {}, 12); // the scene's clock runs to its last frame
          window.__timelines = window.__timelines || {};
          window.__timelines["s3"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
