<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>1. Title</title>
    <script src="../assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Outfit"; src: url("../assets/fonts/outfit-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      @font-face { font-family: "JetBrains Mono"; src: url("../assets/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; font-display: block; }
      :root { --ground: #111315; --panel: #1a1d20; --ink: #f4f5f3; --muted: #9aa2a8; --green: #3fe08a; --green-ink: #06210f; --display: "Outfit", sans-serif; --mono: "JetBrains Mono", monospace; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      .clip { position: absolute; inset: 0; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; padding: 120px 140px 150px; background: var(--ground); color: var(--ink); font-family: var(--display); }
      .eyebrow { font: 600 30px/1 var(--mono); letter-spacing: 0.22em; text-transform: uppercase; color: var(--green); }
      .big { font-weight: 800; letter-spacing: -0.035em; line-height: 0.95; }
      .green { color: var(--green); }
      .muted { color: var(--muted); }
      .abs { position: absolute; }
      /* comic-book dots, used sparingly */
      .dots { position: absolute; background-image: radial-gradient(circle at 50% 50%, var(--green) 0 34%, transparent 36%); background-size: 26px 26px; opacity: 0.16; }
      /* 1 title */
      #root h1 { font-size: 176px; margin-top: 46px; }
      #root h1 span { display: block; }
      #you { right: 120px; top: 330px; width: 560px; height: 560px; font-size: 190px; background: var(--green); clip-path: polygon(50% 1%, 58.5% 19%, 73% 7%, 73% 27%, 92% 25%, 82% 41.5%, 99% 50%, 82% 58.5%, 92% 75%, 73% 73%, 73% 93%, 58.5% 81%, 50% 99%, 41.5% 81%, 27% 93%, 27% 73%, 8% 75%, 18% 58.5%, 1% 50%, 18% 41.5%, 8% 25%, 27% 27%, 27% 7%, 41.5% 19%); display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: -0.04em; color: var(--green-ink); }
      #byline { left: 140px; bottom: 150px; font: 500 34px/1.2 var(--display); color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s1" data-width="1920" data-height="1080" data-duration="7.2">

        <div class="dots" style="left:0;top:0;width:520px;height:260px"></div>
        <p class="eyebrow" id="s1e">An essay in a minute and a half</p>
        <h1 class="big"><span id="s1l1">AI&rsquo;s efficiency</span><span id="s1l2">promise has</span><span id="s1l3">a catch.</span></h1>
        <div id="you" class="abs">You.</div>
        <p id="byline" class="abs">From the essay by Kol Tregaskes, Kol&rsquo;s Korner</p>
      <script>
        (function () {
          // This scene runs from 0 s of the film. Times below are film times; at() turns them into this scene's own clock.
          const T0 = 0, at = t => Math.round((t - T0) * 1000) / 1000, tl = gsap.timeline({ paused: true });
          const fromTo = (sel, a, b, t) => tl.fromTo(sel, a, b, at(t)), to = (sel, v, t) => tl.to(sel, v, at(t));
          const up = (sel, t, y = 46, d = 0.5) => fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const slam = (sel, t, from = 1.7) => fromTo(sel, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, t);
          const pop = (sel, t) => fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(2.4)" }, t);
          const off = (sel, t, d = 0.3) => to(sel, { opacity: 0, duration: d, ease: "power2.in" }, t);
          up("#s1e", 0.1, 20); up("#s1l1", 0.7); up("#s1l2", 1.0); up("#s1l3", 1.3);
          fromTo("#you", { opacity: 0, scale: 0.2, rotation: -24 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.4, ease: "back.out(1.8)" }, 3.6);
          to("#you", { rotation: 3, duration: 3.2, ease: "none" }, 4.0);
          up("#byline", 4.8, 20);
          tl.set({}, {}, 7.2); // the scene's clock runs to its last frame
          window.__timelines = window.__timelines || {};
          window.__timelines["s1"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
