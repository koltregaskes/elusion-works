name: Elusion Works Site Health Check

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_CHANNEL: msedge
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

on:
  schedule:
    - cron: "15 7,19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Node
        id: node
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"

      - name: Install locked monitor dependencies (no browser download)
        id: dependencies
        run: npm ci

      - name: Prove monitor setup faults are distinct from site failures
        id: regression
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {checkSiteHealth} from './scripts/check-site-health.mjs';
          const readFeed=async()=>({stats:{sites:1,tools:1,games:1}});
          let navigations=0,closed=false;
          const setup=await checkSiteHealth({readFeed,launchBrowser:async()=>{throw new Error('synthetic browser unavailable');}});
          assert.equal(setup.status,'monitor_setup_failed');
          assert.equal(setup.navigationAttempted,false);
          const unavailable=await checkSiteHealth({readFeed,launchBrowser:async()=>({newPage:async()=>({setDefaultTimeout(){},on(){},goto:async()=>{navigations++;throw new Error('net::ERR_CONNECTION_REFUSED');}}),close:async()=>{closed=true;}})});
          assert.equal(unavailable.status,'site_down');
          assert.equal(unavailable.navigationAttempted,true);
          assert.equal(navigations,1);
          assert.equal(closed,true);
          const invalid=await checkSiteHealth({readFeed:async()=>{throw new Error('synthetic invalid monitor input');},launchBrowser:async()=>{throw new Error('must not launch');}});
          assert.equal(invalid.status,'monitor_setup_failed');
          assert.equal(invalid.navigationAttempted,false);
          console.log('Monitor regressions passed: setup failures do not report site down; navigation failure does; browser cleanup ran.');
          EOF

      - name: Verify live site with installed Edge
        env:
          SITE_URL: https://elusionworks.com/
        run: node scripts/check-site-health.mjs

      - name: Explain monitor setup failure (site was not checked)
        if: always() && (steps.checkout.outcome != 'success' || steps.node.outcome != 'success' || steps.dependencies.outcome != 'success' || steps.regression.outcome != 'success')
        run: |
          echo '::error title=Monitor setup failed::monitor setup failed: checkout, Node, dependency installation or monitor regressions failed; no site outage was established.'
          echo 'Monitor setup failed. The live site was not checked; this is not evidence of a site outage.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload healthcheck artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elusion-works-healthcheck
          path: healthchecks/
