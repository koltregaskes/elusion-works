name: Deploy Elusion Works to Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["main"]
  # Publish fresh Orbit Census data as soon as a refresh passes its gate.
  workflow_run:
    workflows: ["Refresh Orbit Census data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Assemble and validate the launch bundle
        run: python scripts/build-site.py

      # Orbit Census data refreshes in its own workflow (orbit-census-data.yml), which saves each
      # catalogue that passes the strict gate to the cache. The deploy takes the newest of those,
      # or else the catalogue already live, and never fetches CelesTrak itself. An upstream outage
      # can only make the data older, shown on the page as its "data as of" date; it never blocks
      # a deploy (25 Nov: CelesTrak pauses and stalls blocked four deploys).
      - name: Restore last good Orbit Census catalogue
        uses: actions/cache/restore@v4
        with:
          path: _site/demos/orbit-census/data/catalog.json
          key: orbit-catalogue-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: orbit-catalogue-v1-

      - name: Fall back to the published catalogue
        run: |
          if [ ! -s _site/demos/orbit-census/data/catalog.json ]; then
            echo "::warning::No refreshed Orbit Census catalogue in the cache; reusing the published catalogue."
            mkdir -p _site/demos/orbit-census/data
            curl -fsSL --retry 3 --max-time 60 -o "$RUNNER_TEMP/catalog.json" https://elusionworks.com/demos/orbit-census/data/catalog.json
            mv "$RUNNER_TEMP/catalog.json" _site/demos/orbit-census/data/catalog.json
          fi

      # Structure must be sound (a broken file would break the demo); age only warns.
      - name: Check Orbit Census catalogue structure
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { inspectCatalogue } from './demos/orbit-census/src/catalogue-status.js';
          const fail = message => { console.error(`::error::Orbit Census: ${message}`); process.exit(1); };
          let doc;
          try { doc=JSON.parse(readFileSync('_site/demos/orbit-census/data/catalog.json','utf8')); }
          catch { fail('catalogue is missing, empty or invalid JSON.'); }
          let status;
          try { status=inspectCatalogue(doc); } catch(error) { fail(error.message); }
          const asOf=new Date(status.acquired).toISOString();
          if (status.partial || status.staleAcquisition) console.log(`::warning::Orbit Census data as of ${asOf} is ${status.partial?'partial':'stale'}; deploying it with its date shown.`);
          console.log(`Orbit Census catalogue: ${doc.rows.length} objects; data as of ${asOf}.`);
          JS

      - name: Verify static site bundle
        run: |
          test -f _site/index.html
          test -f _site/styles.css
          test -f _site/showcase-pages.css
          test -f _site/app.js
          test -f _site/cursor.js
          test -f _site/cross-site-nav.js
          test -f _site/404.html
          test -f _site/security.txt
          test -f _site/.well-known/security.txt
          test -f _site/CNAME
          grep -qx 'elusionworks.com' _site/CNAME
          test -f _site/data/estate.js
          test -f _site/data/feed.json
          test -f _site/styles/cabinet.css
          test -f _site/styles/motion.css
          test -f _site/cabinet.js
          test -s _site/feed.xml
          test ! -d _site/scripts
          test ! -f _site/data/editorial-hub.json
          test -f _site/assets/og-card.png
          test -f _site/assets/showcase/ai-resource-hub-site.jpg
          test -f _site/assets/showcase/a-list-site.jpg
          test -f _site/assets/showcase/kols-korner-site.jpg
          test -f _site/assets/showcase/axylusion-site.jpg
          test -f _site/assets/showcase/ghost-in-the-model-site.jpg
          test -f _site/assets/showcase/kol-tregaskes-photography-site.jpg
          test -f _site/assets/showcase/website-news-pipeline.svg
          test -f _site/assets/showcase/published-gallery-pipeline.svg
          test -f _site/assets/showcase/shared-website-tools.svg
          test -f _site/assets/showcase/games-in-development.svg
          test -f _site/assets/showcase/interactive-experiments.svg
          test -f _site/experiments/index.html
          test -f _site/experiments/motion-poster/index.html
          test -f _site/experiments/photography-contact-story/index.html
          test -f _site/experiments/interactive-product-story/index.html
          test -f _site/experiments/data-story/index.html
          test -f _site/creative-radar/index.html
          test -f _site/remix-relay/index.html
          test -f _site/design-notes/index.html
          test -f _site/demos/index.html
          test -f _site/demos/exploded-views/index.html
          test -f _site/demos/windfield/index.html
          test -f _site/demos/orbit-census/index.html
          test -f _site/demos/orbit-census/src/main.js
          test -f _site/demos/orbit-census/src/worker.js
          test -f _site/demos/orbit-census/data/earth.json
          test -f _site/demos/orbit-census/vendor/satellite/index.js
          test -f _site/demos/orbit-census/vendor/three/three.module.min.js
          test -f _site/demos/orbit-census/thumbnail.webp
          test -f _site/demos/planet-teardown/index.html
          test -f _site/demos/planet-teardown/src/main.js
          test -f _site/demos/planet-teardown/src/data.js
          test -f _site/demos/planet-teardown/vendor/three.module.min.js
          test -f _site/demos/planet-teardown/vendor/addons/postprocessing/UnrealBloomPass.js
          test -f _site/demos/planet-teardown/thumbnail.webp
          test -f _site/demos/windfield/vendor/three/build/three.module.js
          test -f _site/demos/exploded-views/laptop.html
          test -f _site/demos/exploded-views/solar.html
          test -f _site/demos/exploded-views/engine.html
          test -f _site/demos/exploded-views/ui.css
          test -f _site/demos/exploded-views/thumbnail.webp
          test -f _site/demos/hoover-dam/index.html
          test -f _site/demos/hoover-dam/styles.css
          test -f _site/demos/hoover-dam/src/app.js
          test -f _site/demos/hoover-dam/src/engine.js
          test -f _site/demos/hoover-dam/vendor/three.module.min.js
          test -f _site/demos/hoover-dam/vendor/three.core.min.js
          test -f _site/demos/hoover-dam/vendor/addons/controls/OrbitControls.js
          test -f _site/demos/hoover-dam/thumbnail.webp
          test -f _site/demos/hoover-dam/og-card.jpg
          test -f _site/demos/hoover-dam/teardown/index.html
          test -f _site/demos/hoover-dam/teardown/src/main.js
          test -f _site/demos/_teardown-kit/stage.js
          test -f _site/demos/_teardown-kit/materials.js
          test -f _site/demos/_teardown-kit/merge.js
          test -f _site/demos/hoover-dam/vendor/addons/utils/BufferGeometryUtils.js
          test -f _site/demos/hoover-dam/teardown/thumbnail.webp
          test -f _site/demos/hoover-dam/vendor/addons/postprocessing/GTAOPass.js
          test -f _site/demos/abyssal-relay/index.html
          test -f _site/demos/abyssal-relay/styles.css
          test -f _site/demos/abyssal-relay/app.js
          test -f _site/demos/abyssal-relay/thumbnail.webp
          test -f _site/demos/abyssal-relay/assets/abyssal-relay-loop.mp4
          test -f _site/demos/abyssal-relay/assets/abyssal-relay-poster.webp
          test -f _site/demos/atmosphere/index.html
          test -f _site/demos/atmosphere/atm-data.js
          test -f _site/demos/atmosphere/atm-weather.js
          test -f _site/demos/atmosphere/atm-sky.jsx
          test -f _site/demos/atmosphere/atm-dial.jsx
          test -f _site/demos/atmosphere/atm-panels.jsx
          test -f _site/demos/atmosphere/atm-pages.jsx
          test -f _site/demos/atmosphere/atm-playback.jsx
          test -f _site/demos/atmosphere/tweaks-panel.jsx
          test -f _site/demos/atmosphere/image-slot.js
          test -f _site/demos/atmosphere/thumbnail.png
          test -f _site/demos/atmosphere/image-slots.state.json
          test -f _site/demos/golden/index.html
          test -f _site/demos/nexus-aetherial/index.html
          test -f _site/demos/nexus-aetherial/styles-hifi.css
          test -f _site/demos/nexus-aetherial/palette.css
          test -f _site/demos/nexus-aetherial/anatomy.css
          test -f _site/demos/nexus-aetherial/data.js
          test -f _site/demos/nexus-aetherial/console.js
          test -f _site/demos/nexus-aetherial/matrix.js
          test -f _site/demos/nexus-aetherial/anatomy.js
          test -f _site/demos/nexus-aetherial/cabinet.js
          test -f _site/demos/nexus-aetherial/digest.js
          test -f _site/demos/nexus-aetherial/shell-hifi.js
          test -f _site/demos/nexus-aetherial/thumbnail.webp
          test -f _site/demos/solar-system/index.html
          test -f _site/demos/last-cartridge/index.html
          test -f _site/demos/chronicles-of-bone/index.html
          test -f _site/demos/chronicles-of-bone/thumbnail.webp
          test -f _site/demos/chronicles-of-bone/image-slots.state.json
          test -f _site/demos/nebula-architect/index.html
          test -f _site/demos/nebula-architect/app.js
          test -f _site/demos/nebula-architect/styles.css
          test -f _site/demos/nebula-architect/thumbnail.png
          test -f _site/demos/solar-system-field-lab/index.html
          test -f _site/demos/solar-system-field-lab/field-lab.jsx
          test -f _site/demos/solar-system-field-lab/orbit-lab.jsx
          test -f _site/demos/solar-system-field-lab/planet-data.jsx
          test -f _site/demos/solar-system-field-lab/planet-detail.jsx
          test -f _site/demos/solar-system-field-lab/tweaks-panel.jsx
          test -f _site/demos/solar-system-field-lab/thumbnail.webp
          test -f _site/demos/lumen-ward/index.html
          test -f _site/demos/lumen-ward/src/main.js
          test -f _site/demos/lumen-ward/assets/lumen-ward-kit.glb
          test -f _site/demos/_shared/three-r187/build/three.webgpu.js
          test -f _site/demos/lumen-ward/assets/lumen-ward-kit.json
          test -f _site/demos/lumen-ward/assets/lumen-ward-far.glb
          test -f _site/demos/lumen-ward/assets/tex/concrete_color.webp
          test -f _site/demos/lumen-ward/thumbnail.webp
          grep -q 'lumen-ward/' _site/demos/index.html
          test -f _site/demos/thornvale/index.html
          test -f _site/demos/thornvale/src/main.js
          test -f _site/demos/thornvale/assets/thornvale-kit.glb
          test -f _site/demos/thornvale/assets/characters/Soldier.glb
          test -f _site/demos/thornvale/assets/tex/leaves.webp
          test -f _site/demos/thornvale/thumbnail.webp
          grep -q 'thornvale/' _site/demos/index.html
          grep -q 'atmosphere/' _site/demos/index.html
          grep -q 'abyssal-relay/' _site/demos/index.html
          grep -q 'exploded-views/' _site/demos/index.html
          grep -q 'nexus-aetherial/' _site/demos/index.html
          grep -q 'solar-system-field-lab/' _site/demos/index.html
          grep -q 'hoover-dam/' _site/demos/index.html
          grep -q 'orbit-census/' _site/demos/index.html
          grep -q 'planet-teardown/' _site/demos/index.html
          # d6 front-door section markers (replaced legacy *-grid and showcase/launch-card IDs)
          grep -q 'id="sites"' _site/index.html
          grep -q 'id="tools"' _site/index.html
          grep -q 'id="games"' _site/index.html
          grep -q 'id="cabinet"' _site/index.html
          grep -q 'Elusion Works demos' _site/demos/index.html
          ! grep -q 'id="editorial"' _site/index.html
          ! grep -q 'editorial-hub' _site/app.js
          ! grep -R -E --include='*.html' --include='*.css' --include='*.js' --include='*.jsx' --include='*.txt' --include='*.xml' 'W:\\|C:\\|review_path|repo_path|review_dir' _site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Archive Pages artifact
        run: |
          tar --dereference --hard-dereference --directory _site \
            --exclude=.git --exclude=.github -cf "$RUNNER_TEMP/artifact.tar" .
          tar -tf "$RUNNER_TEMP/artifact.tar" > "$RUNNER_TEMP/artifact-files.txt"
          cat "$RUNNER_TEMP/artifact-files.txt"
          grep -Fx './.well-known/security.txt' "$RUNNER_TEMP/artifact-files.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

