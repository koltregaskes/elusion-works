name: SEO contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python scripts/check-seo.py
      - run: python scripts/build-rss.py
